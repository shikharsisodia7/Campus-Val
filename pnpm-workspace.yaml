packages:
  - artifacts/*
  - lib/*
  - lib/integrations/*
  - scripts

allowBuilds:
  '@clerk/shared': true
  browser-tabs-lock: true
  core-js: true
  esbuild: true

autoInstallPeers: false

catalog:
  '@replit/vite-plugin-cartographer': ^0.5.1
  '@replit/vite-plugin-dev-banner': ^0.1.1
  '@replit/vite-plugin-runtime-error-modal': ^0.0.6
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': 25.3.5
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.5
  zod: 3.25.76

# A version must have been public for 7 days before it can be installed.
minimumReleaseAge: 10080

# Supply chain: no transitive dependency from git or a tarball URL, and no package version whose
# publishing evidence is weaker than an earlier version's (provenance dropped: a possible takeover).
# The exclusions are the exact versions already locked on 2026-10-07 that come from release lines
# published before their maintainers added provenance (pnpm reported each as a "downgrade"). Any
# other version of these packages is still checked.
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - '@vercel/cli-config@0.2.2'
  - '@vercel/cli-exec@1.0.1'
  - '@vercel/oidc@3.8.2'
  - chokidar@4.0.3
  - pino@9.14.0
  - react-native-worklets@0.5.1
  - semver@6.3.1
  - ua-parser-js@1.0.41

minimumReleaseAgeExclude:
  - '@replit/*'
  - stripe-replit-sync

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # Security: packages other packages bring in, held at the release that fixes
  # a published vulnerability. Each stays within its major version. Remove an
  # entry once the package that brings it in asks for a fixed release itself.
  # (pnpm audit, 2026-09-28; proxy-addr added 2026-10-06; braces and sprintf-js have no fixed release yet;
  # lodash (bundled into the web app by recharts) and fast-copy (server, via pino-pretty) added 2026-10-07
  # from Dependabot, which also sees what Vite bundles.)
  '@xmldom/xmldom@<0.8.15': ^0.8.15
  'lodash@<4.18.0': ^4.18.0
  'fast-copy@>=4.0.0 <4.1.0': ^4.1.0
  # 2026-10-07, the rest of Dependabot's alerts that have a fix in the same major version (mostly
  # build, test and Expo developer tooling; see docs/security/SCU_SECURITY_CHECKLIST.md).
  '@babel/core@<7.29.6': ^7.29.6
  '@xmldom/xmldom@>=0.9.0 <0.9.12': ^0.9.12
  'brace-expansion@>=5.0.0 <5.0.12': ^5.0.12
  'compression@<1.8.2': ^1.8.2
  'fast-uri@<3.1.8': ^3.1.8
  'js-yaml@<3.15.2': ^3.15.2
