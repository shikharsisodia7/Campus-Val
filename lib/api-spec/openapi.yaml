    CourseSection:
      type: object
      properties:
        id:
          type: string
          description: e.g. "COEN-12-01-fall-2025"
        courseCode:
          type: string
        sectionNumber:
          type: string
        term:
          $ref: "#/components/schemas/Term"
        year:
          type: integer
        instructor:
          type: string
        meetingDays:
          type: array
          items:
            type: string
            enum: [M, T, W, R, F, S, U]
        startTime:
          type: string
          description: 24h HH:mm
        endTime:
          type: string
          description: 24h HH:mm
        location:
          type: string
        seatsTotal:
          type: integer
        seatsOpen:
          type: integer
        waitlist:
          type: integer
        seatsKnown:
          type: boolean
          description: True when live seat counts are available (pasted from Workday). False for the official Registrar schedule, which lists offerings/times but not seats.
        tentative:
          type: boolean
          description: True for tentative-schedule terms (Winter/Spring 2027) where section numbers and instructors are not yet finalized.
        componentType:
          type: string
          enum: [lecture, lab, discussion, recitation, unknown]
          description: >-
            Which course component this section is. When the source states an
            instructional format it is used as-is; otherwise it is derived from
            how the course's own sections meet in that term. "unknown" means
            CampusVal could not tell.
        componentInferred:
          type: boolean
          description: True when componentType was derived from the meeting pattern; false when the source published it.
        componentSourceLabel:
          type: ["string", "null"]
          description: The instructional format exactly as the source printed it, when it did.
        availabilityStatus:
          type: string
          enum: [open, waitlist, full, unknown]
          description: >-
            Derived from seatsKnown/seatsOpen/waitlist, never fabricated.
            "unknown" whenever seatsKnown is false (including every tentative
            Winter/Spring term, which never carries seat data). CampusVal has
            no source that distinguishes an instructor-closed section from a
            merely-full one, so both collapse to "full" rather than inventing
            a fifth state without evidence — see docs/SECTION_AVAILABILITY.md.
        lastUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the SOURCE says this section's seat data was true (the live
            feed's own timestamp, or the data steward's paste time). Null when
            no source has said anything (the official Registrar schedule has
            no seat data).
        sourceType:
          type: string
          enum: [workday_live, workday_self_paste, registrar_schedule, fixture]
          description: >-
            Where this section's availability comes from. workday_live only
            for a real authorized upstream feed; workday_self_paste is a
            manual snapshot by the data steward (never live); fixture is
            development sample data (never served in production);
            registrar_schedule means no seat data at all. See
            docs/SECTION_AVAILABILITY.md.
        sourceLabel:
          type: string
          description: Human-readable source label to render next to lastUpdatedAt.
        isLive:
          type: boolean
          description: True ONLY for a real, authorized, recently refreshed live feed. The UI must show a "Live" badge iff this is true.
        freshness:
          type: string
          enum: [live, cached, stale, unavailable]
          description: >-
            How far the timestamp can be trusted. "stale" and "unavailable"
            always come with availabilityStatus "unknown" — an old "open" is
            never presented as open.
      required:
        - id
        - courseCode
        - sectionNumber
        - term
        - year
        - instructor
        - meetingDays
        - startTime
        - endTime
        - location
        - seatsTotal
        - seatsOpen
        - waitlist
        - availabilityStatus
        - lastUpdatedAt
        - sourceType
        - sourceLabel
        - isLive
        - freshness

    SectionAvailabilityStatus:
      type: object
      required: [term, year, state, liveConfigured, lastUpdatedAt, sectionsWithKnownAvailability, counts]
      properties:
        term: { type: string }
        year: { type: integer }
        state:
          type: string
          enum: [live, cached, stale, unavailable, not_connected, sample, manual_snapshot]
          description: >-
            What the section picker may say about seat data for this term:
            live/cached/stale = a live feed is connected (cached and stale
            mean serving an older answer); unavailable = a live feed is
            configured but cannot be reached; not_connected = no live feed
            and no seat data; manual_snapshot = only the data steward's paste;
            sample = development fixture data.
        liveConfigured: { type: boolean }
        lastUpdatedAt:
          type: string
          format: date-time
          nullable: true
        sectionsWithKnownAvailability: { type: integer }
        counts:
          type: object
          required: [open, waitlist, full, unknown]
          properties:
            open: { type: integer }
            waitlist: { type: integer }
            full: { type: integer }
            unknown: { type: integer }

