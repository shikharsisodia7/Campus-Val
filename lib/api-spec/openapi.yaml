        "204":
          description: Deleted
        "404":
          description: Not found
  /plans/{id}/items/{itemId}/replace:
    post:
      operationId: replacePlanPlaceholder
      tags: [plans]
      summary: Replace a requirement placeholder with a chosen course (same plan, same term)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceholderReplacement"
