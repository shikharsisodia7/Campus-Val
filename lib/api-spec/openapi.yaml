openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CampusVal — SCU AI Academic Advising API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: Student profile
  - name: courses
    description: SCU course catalog and prerequisites
  - name: planner
    description: Course planning, unit-load and prereq validation
  - name: gpa
    description: GPA calculation and simulation
  - name: transfer
    description: Transfer credit evaluation
  - name: policies
    description: Verified SCU academic policies
  - name: dashboard
    description: Dashboard summary
  - name: openai
    description: AI advisor chat (OpenAI integration)
  - name: articulation
    description: California Community College → SCU course articulation lookup (ASSIST.org-style)
  - name: graduation-paths
    description: 3-year and 4-year recommended graduation path templates
  - name: evaluation
    description: AI advisor evaluation framework (benchmark scenarios + scoring)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current student profile
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "404":
          description: No profile yet
    put:
      operationId: upsertProfile
      tags: [profile]
      summary: Create or update the student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProfileBody"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
    delete:
      operationId: deleteProfile
      tags: [profile]
      summary: Permanently delete the current student profile and associated data
      responses:
        "204":
          description: Profile deleted

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List SCU courses
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
        - name: core
          in: query
          description: Filter to courses fulfilling SCU Core requirements
          schema:
            type: boolean
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /courses/{code}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get a course with prerequisites
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Not found

  /planner/check:
    post:
      operationId: checkPlan
      tags: [planner]
      summary: Validate a planned quarter (units, prereqs, overload)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckPlanBody"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanCheckResult"
  /planner/prereqs:
    post:
      operationId: checkPrereqs
      tags: [planner]
      summary: Check whether the student has met prerequisites for a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckPrereqsBody"
      responses:
        "200":
          description: Prereq result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrereqCheckResult"

  /gpa/calculate:
    post:
      operationId: calculateGpa
      tags: [gpa]
      summary: Calculate GPA from a list of graded courses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateGpaBody"
      responses:
        "200":
          description: GPA result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GpaResult"
  /gpa/simulate:
    post:
      operationId: simulateGpa
      tags: [gpa]
      summary: Simulate next-term GPA, including overload eligibility (>=3.0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateGpaBody"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GpaSimulationResult"

  /transfer/evaluate:
    post:
      operationId: evaluateTransfer
      tags: [transfer]
      summary: Evaluate transfer credits against SCU rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateTransferBody"
      responses:
        "200":
          description: Transfer evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferEvaluationResult"

  /policies:
    get:
      operationId: listPolicies
      tags: [policies]
      summary: List verified SCU academic policies
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Combined dashboard data for the current student
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /courses/{code}/sections:
    get:
      operationId: listCourseSections
      tags: [courses]
      summary: List scheduled sections (instructors, meeting times, ratings) for a course
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: term
          in: query
          schema:
            $ref: "#/components/schemas/Term"
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseSection"

  /sections/sync:
    post:
      operationId: syncWorkdaySections
      tags: [sections]
      summary: Parse pasted Workday section data and upsert into the database
      description: |
        Accepts text copied from SCU's Workday "Find Course Sections" view.
        The user's Workday password is never sent to or stored by the server —
        only the visible section table is parsed and saved. Re-syncing the
        same term overwrites prior rows for that term.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkdaySyncRequest"
      responses:
        "200":
          description: Sync result with parse summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkdaySyncResult"

  /sections/sync/status:
    get:
      operationId: getSectionsSyncStatus
      tags: [sections]
      summary: Per-term summary of pasted Workday sections
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionsSyncStatus"

  /articulation:
    get:
      operationId: lookupArticulation
      tags: [articulation]
      summary: Look up SCU equivalent for a California Community College course
      parameters:
        - name: institution
          in: query
          required: true
          schema:
            type: string
            description: e.g. "De Anza College"
        - name: courseCode
          in: query
          schema:
            type: string
            description: Source course code, e.g. "CIS 22A"
        - name: scuTarget
          in: query
          schema:
            type: string
            description: Optional target SCU course code to filter on
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticulationLookupResult"

  /graduation-paths/majors:
    get:
      operationId: listGraduationMajors
      tags: [graduation-paths]
      summary: List majors that have a graduation-path recipe configured
      responses:
        "200":
          description: Available majors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MajorList"

  /graduation-paths/minors:
    get:
      operationId: listGraduationMinors
      tags: [graduation-paths]
      summary: List minors available at SCU
      responses:
        "200":
          description: Available minors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinorList"

  /graduation-paths/requirements:
    get:
      operationId: getMajorRequirements
      tags: [graduation-paths]
      summary: Get the grouped, all-courses requirement list for a major
      parameters:
        - name: major
          in: query
          schema:
            type: string
            description: Major code (e.g. "CSE", "ACTG"). Defaults to CSE.
        - name: completed
          in: query
          schema:
            type: string
            description: Comma-separated list of course codes the student has already completed.
        - name: apIbCredits
          in: query
          schema:
            type: string
            description: Comma-separated list of course codes earned via AP/IB. Treated identically to `completed` server-side.
      responses:
        "200":
          description: Major requirements grouped by category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MajorRequirements"
        "404":
          description: Unknown major

  /graduation-paths/{type}:
    get:
      operationId: getGraduationPath
      tags: [graduation-paths]
      summary: Get a recommended 3-year or 4-year graduation path template
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [three_year, four_year]
        - name: major
          in: query
          schema:
            type: string
            description: Major code, e.g. "CSE" (Computer Science & Engineering). Defaults to CSE.
        - name: completed
          in: query
          schema:
            type: string
            description: Comma-separated list of course codes the student has already completed. Completed courses are excluded from the suggested per-quarter plan.
        - name: apIbCredits
          in: query
          schema:
            type: string
            description: Comma-separated list of course codes earned via AP/IB. Treated identically to `completed` server-side.
      responses:
        "200":
          description: Path template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraduationPath"

  /professors:
    get:
      operationId: listProfessors
      tags: [professors]
      summary: List instructors derived from synced Workday sections (deduped, grouped by department)
      parameters:
        - name: q
          in: query
          schema:
            type: string
            description: Optional case-insensitive substring match on instructor name or department.
      responses:
        "200":
          description: Professor directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessorList"

  /requirements:
    get:
      operationId: getDegreeRequirements
      tags: [requirements]
      summary: College-aware degree requirements (University Core, college/school, and major) with official SCU source URLs and completion status
      responses:
        "200":
          description: Requirement groups for the student's college and major, with per-item completion computed from the profile's completed courses. Items SCU defines as "choose from an approved list" are flagged needsVerification instead of being fabricated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeRequirementsResponse"
        "404":
          description: No profile yet (onboarding incomplete)

  /requirements/completions:
    get:
      operationId: listRequirementCompletions
      tags: [requirements]
      summary: List the signed-in student's manual requirement check-offs (with provenance)
      parameters:
        - name: collegeCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Manual check-offs for that college
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequirementCompletion"
    put:
      operationId: setRequirementCompletion
      tags: [requirements]
      summary: Mark or unmark an approved-list requirement as completed by the student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRequirementCompletionBody"
      responses:
        "200":
          description: Updated list of check-offs for that college
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequirementCompletion"
    delete:
      operationId: resetRequirementCompletions
      tags: [requirements]
      summary: Clear all manual check-offs for a college
      parameters:
        - name: collegeCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cleared

  /evaluation/scenarios:
    get:
      operationId: listEvaluationScenarios
      tags: [evaluation]
      summary: List benchmark scenarios used to evaluate the AI advisor
      responses:
        "200":
          description: Benchmark scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvaluationScenario"
  /evaluation/run:
    post:
      operationId: runEvaluation
      tags: [evaluation]
      summary: Run all benchmark scenarios against the AI advisor and return scored results
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunEvaluationBody"
      responses:
        "200":
          description: Evaluation run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationRunResult"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List the student's academic plans (creates the Degree Plan on first call)
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicPlanList"
    post:
      operationId: createPlan
      tags: [plans]
      summary: Create a tentative plan (optionally copying an existing plan)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicPlanInput"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicPlan"
        "400":
          description: Invalid input
  /plans/{id}:
    get:
      operationId: getPlan
      tags: [plans]
      summary: Get a plan with all its items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plan detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicPlanDetail"
        "404":
          description: Not found
    patch:
      operationId: updatePlan
      tags: [plans]
      summary: Rename a plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicPlanUpdate"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicPlan"
        "404":
          description: Not found
    delete:
      operationId: deletePlan
      tags: [plans]
      summary: Delete a tentative plan (the Degree Plan cannot be deleted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete the Degree Plan
        "404":
          description: Not found
  /plans/{id}/duplicate:
    post:
      operationId: duplicatePlan
      tags: [plans]
      summary: Duplicate a plan as a new tentative plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicPlanDuplicateInput"
      responses:
        "201":
          description: New tentative plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicPlan"
        "404":
          description: Not found
  /plans/{id}/promote:
    post:
      operationId: promotePlan
      tags: [plans]
      summary: Use a tentative plan as the Degree Plan (previous Degree Plan is kept as a tentative backup)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The promoted plan (now the Degree Plan)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicPlan"
        "400":
          description: Plan is already the Degree Plan
        "404":
          description: Not found
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for a private file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /progress-report:
    get:
      tags: [progressReport]
      operationId: getProgressReport
      summary: Get the current user's Academic Progress Report metadata
      responses:
        "200":
          description: Report metadata (or null when none uploaded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReportEnvelope"
    post:
      tags: [progressReport]
      operationId: registerProgressReport
      summary: Register an uploaded Academic Progress Report (replaces any prior one)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReportRegisterInput"
      responses:
        "201":
          description: Stored report metadata with conservative extraction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReport"
        "400":
          description: Unsupported format or size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    delete:
      tags: [progressReport]
      operationId: deleteProgressReport
      summary: Delete the current user's Academic Progress Report
      responses:
        "204":
          description: Deleted
        "404":
          description: No report on file
  /progress-report/file:
    get:
      tags: [progressReport]
      operationId: downloadProgressReport
      summary: Download the original uploaded report (owner only)
      responses:
        "200":
          description: Original file streamed
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: No report on file
  /plans/{id}/items:
    post:
      operationId: addPlanItem
      tags: [plans]
      summary: Add a course or requirement placeholder to a plan term
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanItem"
        "400":
          description: Invalid input
        "404":
          description: Not found
        "409":
          description: Duplicate course in plan (send allowDuplicate to override)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanDuplicateWarning"
  /plans/{id}/items/{itemId}:
    patch:
      operationId: updatePlanItem
      tags: [plans]
      summary: Move an item to another term/year, reorder it, or edit its note
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanItem"
        "404":
          description: Not found
    delete:
      operationId: deletePlanItem
      tags: [plans]
      summary: Remove an item from a plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /plans/{id}/items/{itemId}/replace:
    post:
      operationId: replacePlanPlaceholder
      tags: [plans]
      summary: Replace a requirement placeholder with a chosen course (same plan, same term)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceholderReplacement"
      responses:
        "200":
          description: The new course item that replaced the placeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanItem"
        "400":
          description: Item is not a placeholder or course unknown
        "404":
          description: Not found
  /plans/{id}/export:
    get:
      operationId: exportPlan
      tags: [plans]
      summary: Export a plan as an advisor-friendly Excel workbook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: XLSX workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
  /schedule-availability:
    get:
      operationId: getScheduleAvailability
      tags: [plans]
      summary: Which SCU quarters have published/tentative official schedules
      responses:
        "200":
          description: Availability of official schedule data per term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleAvailability"

  /schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List the signed-in student's quarter schedules
      parameters:
        - name: term
          in: query
          required: false
          schema: { type: string, enum: [fall, winter, spring, summer] }
        - name: year
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Schedules (optionally filtered by quarter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarterScheduleList"
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Create a new schedule for a quarter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuarterScheduleInput"
      responses:
        "201":
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarterScheduleDetail"
        "400":
          description: Invalid input
  /schedules/{id}:
    get:
      operationId: getSchedule
      tags: [schedules]
      summary: Get a schedule with all its events
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Schedule detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarterScheduleDetail"
        "404":
          description: Not found
    patch:
      operationId: updateSchedule
      tags: [schedules]
      summary: Rename a schedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuarterScheduleUpdate"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarterScheduleDetail"
        "404":
          description: Not found
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Delete a schedule and its events
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /schedules/{id}/duplicate:
    post:
      operationId: duplicateSchedule
      tags: [schedules]
      summary: Deep-copy a schedule (independent copy of all events)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: The new independent schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarterScheduleDetail"
        "404":
          description: Not found
  /schedules/{id}/events:
    post:
      operationId: addScheduleEvent
      tags: [schedules]
      summary: Add a course section or commitment to a schedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleEventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEvent"
        "400":
          description: Invalid input (e.g. unknown section)
        "404":
          description: Schedule not found
        "409":
          description: Section already on this schedule
  /schedules/{id}/events/{eventId}:
    patch:
      operationId: updateScheduleEvent
      tags: [schedules]
      summary: Update an event (swap section or edit a commitment)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleEventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEvent"
        "400":
          description: Invalid input
        "404":
          description: Not found
    delete:
      operationId: deleteScheduleEvent
      tags: [schedules]
      summary: Remove an event from a schedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /core-areas:
    get:
      operationId: listCoreAreas
      tags: [schedules]
      summary: Authoritative list of SCU Core areas present in the catalog
      responses:
        "200":
          description: Core areas with course counts
          content:
            application/json:
              schema:
                type: object
                required: [coreAreas, pathwaysAvailable]
                properties:
                  coreAreas:
                    type: array
                    items:
                      type: object
                      required: [name, courseCount]
                      properties:
                        name: { type: string }
                        courseCount: { type: integer }
                  pathwaysAvailable:
                    type: boolean
                    description: False until an authoritative Pathway-to-course mapping exists.
  /course-search:
    get:
      operationId: searchCourses
      tags: [schedules]
      summary: Advanced course search by text and academic attributes
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: coreAreas
          in: query
          required: false
          description: Comma-separated Core area names
          schema: { type: string }
        - name: matchMode
          in: query
          required: false
          schema: { type: string, enum: [all, any], default: all }
        - name: term
          in: query
          required: false
          schema: { type: string, enum: [fall, winter, spring, summer] }
        - name: year
          in: query
          required: false
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Search results with an explicit zero-result state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseSearchResult"

components:
  schemas:
    QuarterSchedule:
      type: object
      required: [id, name, term, year, eventCount, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        term: { type: string }
        year: { type: integer }
        eventCount: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    QuarterScheduleList:
      type: object
      required: [schedules]
      properties:
        schedules:
          type: array
          items: { $ref: "#/components/schemas/QuarterSchedule" }
    QuarterScheduleInput:
      type: object
      required: [name, term, year]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        term: { type: string, enum: [fall, winter, spring, summer] }
        year: { type: integer, minimum: 2000, maximum: 2100 }
    QuarterScheduleUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    QuarterScheduleDetail:
      type: object
      required: [id, name, term, year, events, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        term: { type: string }
        year: { type: integer }
        events:
          type: array
          items: { $ref: "#/components/schemas/ScheduleEvent" }
        createdAt: { type: string }
        updatedAt: { type: string }
    ScheduleEventKind:
      type: string
      enum: [section, commitment]
    CommitmentCategory:
      type: string
      enum:
        [
          work,
          athletics,
          student_org,
          special_program,
          external_course,
          personal,
          other,
        ]
    ScheduleEvent:
      type: object
      required: [id, scheduleId, kind, meetingDays, startTime, endTime]
      properties:
        id: { type: integer }
        scheduleId: { type: integer }
        kind: { $ref: "#/components/schemas/ScheduleEventKind" }
        courseCode: { type: ["string", "null"] }
        courseTitle: { type: ["string", "null"] }
        sectionNumber: { type: ["string", "null"] }
        units: { type: ["number", "null"] }
        instructor: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        category:
          oneOf:
            - $ref: "#/components/schemas/CommitmentCategory"
            - type: "null"
        institution: { type: ["string", "null"] }
        externalCourseLabel: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        meetingDays:
          type: array
          items: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        location: { type: ["string", "null"] }
    ScheduleEventInput:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/ScheduleEventKind" }
        courseCode: { type: string }
        sectionNumber: { type: string }
        name: { type: string, maxLength: 120 }
        category: { $ref: "#/components/schemas/CommitmentCategory" }
        institution: { type: string, maxLength: 120 }
        externalCourseLabel: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 500 }
        meetingDays:
          type: array
          items: { type: string, enum: [M, T, W, R, F, S, U] }
        startTime: { type: string }
        endTime: { type: string }
        location: { type: string, maxLength: 120 }
    ScheduleEventUpdate:
      type: object
      properties:
        courseCode: { type: string }
        sectionNumber: { type: string }
        name: { type: string, maxLength: 120 }
        category: { $ref: "#/components/schemas/CommitmentCategory" }
        institution: { type: string, maxLength: 120 }
        externalCourseLabel: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 500 }
        meetingDays:
          type: array
          items: { type: string, enum: [M, T, W, R, F, S, U] }
        startTime: { type: string }
        endTime: { type: string }
        location: { type: string, maxLength: 120 }
    CourseSearchState:
      type: string
      enum: [results, no_matching_courses, no_sections_this_quarter]
    CourseSearchResult:
      type: object
      required: [state, totalMatching, courses]
      properties:
        state: { $ref: "#/components/schemas/CourseSearchState" }
        totalMatching:
          type: integer
          description: Courses matching the criteria regardless of quarter sections.
        courses:
          type: array
          items:
            type: object
            required: [code, title, units, coreAreas, sectionsThisQuarter]
            properties:
              code: { type: string }
              title: { type: string }
              units: { type: number }
              description: { type: string }
              coreAreas:
                type: array
                items: { type: string }
              sectionsThisQuarter:
                type: ["integer", "null"]
                description: Null when no quarter filter was applied.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    StudentType:
      type: string
      enum: [first_year, transfer, continuing, graduate, postgrad]
    PlanType:
      type: string
      enum: [degree, tentative]
    PlanItemType:
      type: string
      enum: [course, requirement_placeholder]
    AcademicPlan:
      type: object
      required: [id, name, planType, itemCount, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        planType: { $ref: "#/components/schemas/PlanType" }
        sourcePlanId: { type: ["integer", "null"] }
        metadata: { $ref: "#/components/schemas/PlanMetadata" }
        itemCount: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    AcademicPlanList:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items: { $ref: "#/components/schemas/AcademicPlan" }
    AcademicPlanInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        copyFromPlanId:
          type: ["integer", "null"]
          description: Copy all items from this plan; omit or null to start blank.
    AcademicPlanUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        metadata: { $ref: "#/components/schemas/PlanMetadata" }
    PlanMetadata:
      type: object
      properties:
        addedYears:
          type: array
          items: { type: integer, minimum: 2000, maximum: 2100 }
        summerYears:
          type: array
          items: { type: integer, minimum: 2000, maximum: 2100 }
        scenarioMajors:
          type: array
          items: { type: string, minLength: 1, maxLength: 120 }
          description: Draft-only additional majors; does not alter the official student profile.
        scenarioMinors:
          type: array
          items: { type: string, minLength: 1, maxLength: 120 }
          description: Draft-only additional minors; does not alter the official student profile.
    AcademicPlanDuplicateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    PlanItem:
      type: object
      required: [id, planId, itemType, academicYear, term, position]
      properties:
        id: { type: integer }
        planId: { type: integer }
        itemType: { $ref: "#/components/schemas/PlanItemType" }
        courseCode: { type: ["string", "null"] }
        courseTitle: { type: ["string", "null"] }
        units: { type: ["number", "null"] }
        requirementId: { type: ["string", "null"] }
        requirementCategory: { type: ["string", "null"] }
        requirementLabel: { type: ["string", "null"] }
        academicYear:
          type: integer
          description: Start year of the academic year (2026 = 2026-2027)
        term: { $ref: "#/components/schemas/Term" }
        bucket: { $ref: "#/components/schemas/PlanItemBucket" }
        completionSource:
          oneOf:
            - $ref: "#/components/schemas/CompletionSource"
            - type: "null"
        position: { type: integer }
        note: { type: ["string", "null"] }
    AcademicPlanDetail:
      type: object
      required: [id, name, planType, items, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        planType: { $ref: "#/components/schemas/PlanType" }
        sourcePlanId: { type: ["integer", "null"] }
        metadata: { $ref: "#/components/schemas/PlanMetadata" }
        items:
          type: array
          items: { $ref: "#/components/schemas/PlanItem" }
        createdAt: { type: string }
        updatedAt: { type: string }
    PlanItemInput:
      type: object
      required: [itemType, academicYear, term]
      properties:
        itemType: { $ref: "#/components/schemas/PlanItemType" }
        courseCode:
          type: string
          description: Required for course items; must exist in the SCU catalog.
        requirementId: { type: string }
        requirementCategory: { type: string }
        requirementLabel:
          type: string
          description: Required for requirement_placeholder items.
        academicYear: { type: integer }
        term: { $ref: "#/components/schemas/Term" }
        bucket:
          $ref: "#/components/schemas/PlanItemBucket"
        completionSource:
          $ref: "#/components/schemas/CompletionSource"
        note: { type: string }
        allowDuplicate:
          type: boolean
          description: Set true to add a course already present in this plan.
    PlanItemUpdate:
      type: object
      properties:
        academicYear: { type: integer }
        term: { $ref: "#/components/schemas/Term" }
        bucket: { $ref: "#/components/schemas/PlanItemBucket" }
        completionSource:
          oneOf:
            - $ref: "#/components/schemas/CompletionSource"
            - type: "null"
        position: { type: integer }
        note: { type: ["string", "null"] }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `application/pdf`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`).
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ProgressReport:
      type: object
      required:
        [id, fileName, fileSize, contentType, status, uploadedAt, extracted]
      properties:
        id: { type: integer }
        fileName: { type: string }
        fileSize: { type: integer }
        contentType: { type: string }
        status:
          type: string
          enum: [stored, parsed, error]
          description: >-
            stored = file saved but nothing could be conservatively extracted;
            parsed = some fields were reliably extracted; error = the file
            could not be read.
        parseError: { type: ["string", "null"] }
        uploadedAt: { type: string, format: date-time }
        extracted:
          $ref: "#/components/schemas/ProgressReportExtract"
    ProgressReportExtract:
      type: object
      required: [courses, notes]
      description: >-
        Conservatively extracted fields only. Anything the parser can't
        reliably identify is omitted rather than guessed.
      properties:
        courses:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code: { type: string }
              title: { type: ["string", "null"] }
              units: { type: ["number", "null"] }
              grade: { type: ["string", "null"] }
        notes:
          type: array
          items: { type: string }
          description: Honest caveats about what could not be extracted.
    ProgressReportRegisterInput:
      type: object
      required: [objectPath, fileName, fileSize, contentType]
      properties:
        objectPath: { type: string }
        fileName: { type: string }
        fileSize: { type: integer }
        contentType: { type: string }
    ProgressReportEnvelope:
      type: object
      required: [report]
      properties:
        report:
          oneOf:
            - $ref: "#/components/schemas/ProgressReport"
            - type: "null"
    PlanItemBucket:
      type: string
      enum: [planned, completed]
      description: >-
        Where the item lives: "planned" places it in a real term column;
        "completed" places it in the Completed Before Current Plan area.
    CompletionSource:
      type: string
      enum:
        - prior_to_scu
        - transfer_credit
        - ap_ib_test_credit
        - previously_completed_scu
        - other_institution
        - manually_marked
      description: >-
        Student-asserted provenance for a completed item. Distinct from
        verified Academic Progress Report data.
    PlaceholderReplacement:
      type: object
      required: [courseCode]
      properties:
        courseCode: { type: string, minLength: 1 }
    PlanDuplicateWarning:
      type: object
      required: [error, duplicate]
      properties:
        error: { type: string }
        duplicate: { type: boolean }
    ScheduleAvailabilityTerm:
      type: object
      required: [term, year, status, officialSectionCount, syncedSectionCount]
      properties:
        term: { $ref: "#/components/schemas/Term" }
        year: { type: integer }
        status:
          type: string
          enum: [published, tentative]
          description: published = official schedule with sections/instructors; tentative = registrar tentative schedule (no instructors/sections confirmed)
        officialSectionCount: { type: integer }
        syncedSectionCount: { type: integer }
        offeredCourseCodes:
          type: array
          items: { type: string }
          description: Normalized (uppercase, single-spaced) course codes present in the official schedule for this term. Used to flag planned courses absent from the published/tentative schedule.
    ScheduleAvailability:
      type: object
      required: [terms, note]
      properties:
        terms:
          type: array
          items: { $ref: "#/components/schemas/ScheduleAvailabilityTerm" }
        note:
          type: string
          description: Honest explanation of what unlisted terms mean (no official schedule published).
    Term:
      type: string
      enum: [fall, winter, spring, summer]
    Grade:
      type: string
      enum: [A_PLUS, A, A_MINUS, B_PLUS, B, B_MINUS, C_PLUS, C, C_MINUS, D_PLUS, D, D_MINUS, F, P, NP, IP, W]

    StudentProfile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        studentType:
          $ref: "#/components/schemas/StudentType"
        college:
          type: string
          description: e.g. "Arts and Sciences", "Engineering", "Business"
        major:
          type: string
        secondMajor:
          type: string
          nullable: true
        minor:
          type: string
          nullable: true
        additionalMajors:
          type: array
          items:
            type: string
        additionalMinors:
          type: array
          items:
            type: string
        startTerm:
          $ref: "#/components/schemas/Term"
        startYear:
          type: integer
        expectedGradTerm:
          $ref: "#/components/schemas/Term"
        expectedGradYear:
          type: integer
        unitsCompletedAtSCU:
          type: number
        unitsTransferredIn:
          type: number
        cumulativeGpa:
          type: number
          nullable: true
        majorGpa:
          type: number
          nullable: true
        completedCourseCodes:
          type: array
          items:
            type: string
        priorityRegistration:
          type: boolean
        currentTerm:
          $ref: "#/components/schemas/Term"
        currentYear:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - studentType
        - college
        - major
        - additionalMajors
        - additionalMinors
        - startTerm
        - startYear
        - expectedGradTerm
        - expectedGradYear
        - unitsCompletedAtSCU
        - unitsTransferredIn
        - completedCourseCodes
        - priorityRegistration
        - currentTerm
        - currentYear
        - updatedAt
    UpsertProfileBody:
      type: object
      properties:
        name:
          type: string
        studentType:
          $ref: "#/components/schemas/StudentType"
        college:
          type: string
        major:
          type: string
        secondMajor:
          type: string
          nullable: true
        minor:
          type: string
          nullable: true
        additionalMajors:
          type: array
          items:
            type: string
        additionalMinors:
          type: array
          items:
            type: string
        startTerm:
          $ref: "#/components/schemas/Term"
        startYear:
          type: integer
        expectedGradTerm:
          $ref: "#/components/schemas/Term"
        expectedGradYear:
          type: integer
        unitsCompletedAtSCU:
          type: number
        unitsTransferredIn:
          type: number
        cumulativeGpa:
          type: number
          nullable: true
        majorGpa:
          type: number
          nullable: true
        completedCourseCodes:
          type: array
          items:
            type: string
        priorityRegistration:
          type: boolean
        currentTerm:
          $ref: "#/components/schemas/Term"
        currentYear:
          type: integer
      required:
        - name
        - studentType
        - college
        - major
        - additionalMajors
        - additionalMinors
        - startTerm
        - startYear
        - expectedGradTerm
        - expectedGradYear
        - unitsCompletedAtSCU
        - unitsTransferredIn
        - completedCourseCodes
        - priorityRegistration
        - currentTerm
        - currentYear

    Course:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        department:
          type: string
        units:
          type: number
        description:
          type: string
        coreAreas:
          type: array
          items:
            type: string
        offeredTerms:
          type: array
          items:
            $ref: "#/components/schemas/Term"
        difficulty:
          type: string
          enum: [easy, moderate, hard, very_hard]
          nullable: true
        restrictedToColleges:
          type: array
