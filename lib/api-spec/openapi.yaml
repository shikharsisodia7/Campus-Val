          required: true
          schema:
            type: integer
        - name: customId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomRequirementPatch"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementCustomizationSummary"
        "400":
          description: Invalid edit
        "404":
          description: Not found
    delete:
      operationId: deleteCustomRequirement
      tags: [requirements]
      summary: Delete a custom requirement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: customId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementCustomizationSummary"
        "404":
          description: Not found
  /plans/{id}/promote:
    post:
      operationId: promotePlan
      tags: [plans]
      summary: Use a tentative plan as the Degree Plan (previous Degree Plan is kept as a tentative backup)
      parameters:
