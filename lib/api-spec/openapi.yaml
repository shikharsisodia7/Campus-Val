        "404":
          description: Not found
        "409":
          description: Duplicate course in plan (send allowDuplicate to override)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanDuplicateWarning"
  /plans/{id}/items/bulk-import:
    post:
      operationId: bulkImportPlanItems
      tags: [plans]
