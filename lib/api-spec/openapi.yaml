    RequirementChoice:
      type: [object, "null"]
      description: >-
        How a choice requirement is satisfied, when it is one: "choose N" from
        named Bulletin course lists, or one of several alternative course sets.
        Counts are CampusVal's planning view; each course counts toward one
        requirement of the program only. Null for a single-course requirement.
      required: [kind, minimum, completedCount, plannedCount, lists, alternatives]
      properties:
        kind:
          type: string
          enum: [choose, alternatives]
