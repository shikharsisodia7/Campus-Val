openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CampusVal — SCU AI Academic Advising API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: Student profile
  - name: courses
    description: SCU course catalog and prerequisites
  - name: planner
    description: Course planning, unit-load and prereq validation
  - name: gpa
    description: GPA calculation and simulation
  - name: transfer
    description: Transfer credit evaluation
  - name: policies
    description: Verified SCU academic policies
  - name: dashboard
    description: Dashboard summary
  - name: openai
    description: AI advisor chat (OpenAI integration)
  - name: articulation
    description: California Community College → SCU course articulation lookup (ASSIST.org-style)
  - name: graduation-paths
    description: 3-year and 4-year recommended graduation path templates
  - name: evaluation
    description: AI advisor evaluation framework (benchmark scenarios + scoring)
  - name: storage
    description: Object storage upload and serving endpoints
  - name: progress-report
    description: Academic progress report upload, import, and retrieval
  - name: degree-checksheets
    description: Department checksheets and advising resources a student uploads, and the student's own tracking
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the current student profile
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "404":
          description: No profile yet
    put:
      operationId: upsertProfile
      tags: [profile]
      summary: Create or update the student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertProfileBody"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
    delete:
      operationId: deleteProfile
      tags: [profile]
      summary: Permanently delete the current student profile and associated data
      responses:
        "204":
          description: Profile deleted

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List SCU courses
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
        - name: core
          in: query
          description: Filter to courses fulfilling SCU Core requirements
          schema:
            type: boolean
      responses:
        "200":
          description: Courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"
  /courses/{code}:
    get:
      operationId: getCourse
      tags: [courses]
      summary: Get a course with prerequisites
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Course detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDetail"
        "404":
          description: Not found

  /planner/check:
    post:
      operationId: checkPlan
      tags: [planner]
      summary: Validate a planned quarter (units, prereqs, overload)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckPlanBody"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanCheckResult"
  /planner/prereqs:
    post:
      operationId: checkPrereqs
      tags: [planner]
      summary: Check whether the student has met prerequisites for a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckPrereqsBody"
      responses:
        "200":
          description: Prereq result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrereqCheckResult"

  /gpa/calculate:
    post:
      operationId: calculateGpa
      tags: [gpa]
      summary: Calculate GPA from a list of graded courses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateGpaBody"
      responses:
        "200":
          description: GPA result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GpaResult"
  /gpa/simulate:
    post:
      operationId: simulateGpa
      tags: [gpa]
      summary: Simulate next-term GPA, including overload eligibility (>=3.0)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateGpaBody"
      responses:
        "200":
          description: Simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GpaSimulationResult"

  /transfer/evaluate:
    post:
      operationId: evaluateTransfer
      tags: [transfer]
      summary: Evaluate transfer credits against SCU rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluateTransferBody"
      responses:
        "200":
          description: Transfer evaluation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferEvaluationResult"

  /policies:
    get:
      operationId: listPolicies
      tags: [policies]
      summary: List verified SCU academic policies
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Combined dashboard data for the current student
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /courses/{code}/sections:
    get:
      operationId: listCourseSections
      tags: [courses]
      summary: List scheduled sections (instructors, meeting times, ratings) for a course
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: term
          in: query
          schema:
            $ref: "#/components/schemas/Term"
        - name: year
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Sections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseSection"

  /courses/{code}/components:
    get:
      operationId: getCourseComponents
      tags: [courses]
      summary: Which components (lecture, lab, discussion…) a course needs in one term
      description: |
        The same rule for every course. `sectionsPublished: false` means the course needs
        that component but the term's schedule lists no section for it yet — for example a
        tentative Registrar schedule that lists lectures only. CampusVal never invents one.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
        - name: term
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Term"
        - name: year
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Component plan for the term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseComponentPlan"
        "400":
          description: term and year are required
        "404":
          description: Course not found

  /section-availability/status:
    get:
      operationId: getSectionAvailabilityStatus
      tags: [courses]
      summary: How trustworthy seat availability currently is for a term (live / cached / not connected)
      parameters:
        - name: term
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Term"
        - name: year
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Availability status for the term
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionAvailabilityStatus"
        "400":
          description: Missing or invalid term/year

  /sections/sync:
    post:
      operationId: syncWorkdaySections
      tags: [sections]
      summary: Parse pasted Workday section data and upsert into the database
      description: |
        Accepts text copied from SCU's Workday "Find Course Sections" view.
        The user's Workday password is never sent to or stored by the server —
        only the visible section table is parsed and saved. Re-syncing the
        same term overwrites prior rows for that term.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkdaySyncRequest"
      responses:
        "200":
          description: Sync result with parse summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkdaySyncResult"

  /sections/sync/status:
    get:
      operationId: getSectionsSyncStatus
      tags: [sections]
      summary: Per-term summary of pasted Workday sections
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SectionsSyncStatus"

  /articulation:
    get:
      operationId: lookupArticulation
      tags: [articulation]
      summary: Look up SCU equivalent for a California Community College course
      parameters:
        - name: institution
          in: query
          required: true
          schema:
            type: string
            description: e.g. "De Anza College"
        - name: courseCode
          in: query
          schema:
            type: string
            description: Source course code, e.g. "CIS 22A"
        - name: scuTarget
          in: query
          schema:
            type: string
            description: Optional target SCU course code to filter on
      responses:
        "200":
          description: Lookup result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArticulationLookupResult"

  /graduation-paths/majors:
    get:
      operationId: listGraduationMajors
      tags: [graduation-paths]
      summary: List majors that have a graduation-path recipe configured
      responses:
        "200":
          description: Available majors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MajorList"

  /graduation-paths/minors:
    get:
      operationId: listGraduationMinors
      tags: [graduation-paths]
      summary: List minors available at SCU
      responses:
        "200":
          description: Available minors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinorList"

  /graduation-paths/requirements:
    get:
      operationId: getMajorRequirements
      tags: [graduation-paths]
      summary: Get the grouped, all-courses requirement list for a major
      parameters:
        - name: major
          in: query
          schema:
            type: string
            description: Major code (e.g. "CSE", "ACTG"). Defaults to CSE.
        - name: completed
          in: query
          schema:
            type: string
            description: Comma-separated list of course codes the student has already completed.
        - name: apIbCredits
          in: query
          schema:
            type: string
            description: Comma-separated list of course codes earned via AP/IB. Treated identically to `completed` server-side.
      responses:
        "200":
          description: Major requirements grouped by category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MajorRequirements"
        "404":
          description: Unknown major

  /graduation-paths/{type}:
    get:
      operationId: getGraduationPath
      tags: [graduation-paths]
      summary: Get a recommended 3-year or 4-year graduation path template
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [three_year, four_year]
        - name: major
          in: query
          schema:
            type: string
            description: Major code, e.g. "CSE" (Computer Science & Engineering). Defaults to CSE.
        - name: completed
          in: query
          schema:
            type: string
            description: Comma-separated list of course codes the student has already completed. Completed courses are excluded from the suggested per-quarter plan.
        - name: apIbCredits
          in: query
          schema:
            type: string
            description: Comma-separated list of course codes earned via AP/IB. Treated identically to `completed` server-side.
      responses:
        "200":
          description: Path template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraduationPath"

  /professors:
    get:
      operationId: listProfessors
      tags: [professors]
      summary: List instructors derived from synced Workday sections (deduped, grouped by department)
      parameters:
        - name: q
          in: query
          schema:
            type: string
            description: Optional case-insensitive substring match on instructor name or department.
      responses:
        "200":
          description: Professor directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessorList"

  /requirements:
    get:
      operationId: getDegreeRequirements
      tags: [requirements]
      summary: College-aware degree requirements (University Core, college/school, and major) with official SCU source URLs and completion status
      parameters:
        - name: primaryMajor
          in: query
          schema:
            type: string
          description: >-
            Plan-scoped PRIMARY major code (e.g. "CHEM") to use as the primary
            major instead of the profile's onboarding major. Planning intent
            only — it never changes the official SCU declaration or Workday APR.
            When the effective primary major belongs to a different school/college
            than the profile, the college requirement groups follow the major's
            college.
        - name: scenarioMajors
          in: query
          schema:
            type: string
            description: Comma-separated draft-only additional majors to include (tentative scenarios); does not alter the profile.
        - name: scenarioMinors
          in: query
          schema:
            type: string
            description: Comma-separated draft-only additional minors to include (tentative scenarios); does not alter the profile.
        - name: professionalGoals
          in: query
          schema:
            type: string
          description: JSON-encoded plan-scoped student planning goals. These are not official SCU graduation requirements.
        - name: plannedCourses
          in: query
          schema:
            type: string
          description: >-
            Comma-separated course codes the student has PLANNED in the active
            Degree Plan or Tentative Degree Plan. A planned major course that
            carries a Core designation marks that Core requirement "planned"
            (never "completed"), so the student is not pushed toward adding a
            duplicate course. Plan-scoped: a tentative scenario never affects
            the Degree Plan's requirement view.
      responses:
        "200":
          description: Requirement groups for the student's college and major, with per-item completion computed from the profile's completed courses. Items SCU defines as "choose from an approved list" are flagged needsVerification instead of being fabricated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeRequirementsResponse"
        "404":
          description: No profile yet (onboarding incomplete)

  /requirements/completions:
    get:
      operationId: listRequirementCompletions
      tags: [requirements]
      summary: List the signed-in student's manual requirement check-offs (with provenance)
      parameters:
        - name: collegeCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Manual check-offs for that college
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequirementCompletion"
    put:
      operationId: setRequirementCompletion
      tags: [requirements]
      summary: Mark or unmark an approved-list requirement as completed by the student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRequirementCompletionBody"
      responses:
        "200":
          description: Updated list of check-offs for that college
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequirementCompletion"
    delete:
      operationId: resetRequirementCompletions
      tags: [requirements]
      summary: Clear all manual check-offs for a college
      parameters:
        - name: collegeCode
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cleared

  /evaluation/scenarios:
    get:
      operationId: listEvaluationScenarios
      tags: [evaluation]
      summary: List benchmark scenarios used to evaluate the AI advisor
      responses:
        "200":
          description: Benchmark scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EvaluationScenario"
  /evaluation/run:
    post:
      operationId: runEvaluation
      tags: [evaluation]
      summary: Run all benchmark scenarios against the AI advisor and return scored results
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunEvaluationBody"
      responses:
        "200":
          description: Evaluation run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationRunResult"

  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List the student's academic plans (creates the Degree Plan on first call)
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicPlanList"
    post:
      operationId: createPlan
      tags: [plans]
      summary: Create a tentative plan (optionally copying an existing plan)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicPlanInput"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicPlan"
        "400":
          description: Invalid input
  /plans/{id}:
    get:
      operationId: getPlan
      tags: [plans]
      summary: Get a plan with all its items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plan detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicPlanDetail"
        "404":
          description: Not found
    patch:
      operationId: updatePlan
      tags: [plans]
      summary: Rename a plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicPlanUpdate"
      responses:
        "200":
          description: Updated plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicPlan"
        "404":
          description: Not found
    delete:
      operationId: deletePlan
      tags: [plans]
      summary: Delete a tentative plan (the Degree Plan cannot be deleted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete the Degree Plan
        "404":
          description: Not found
  /plans/{id}/duplicate:
    post:
      operationId: duplicatePlan
      tags: [plans]
      summary: Duplicate a plan as a new tentative plan
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicPlanDuplicateInput"
      responses:
        "201":
          description: New tentative plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicPlan"
        "404":
          description: Not found
  /plans/{id}/requirements:
    get:
      operationId: getPlanRequirements
      tags: [requirements]
      summary: The requirements sidebar for one plan, with that plan's planning customizations applied
      description: >-
        The same requirements GET /requirements builds for this plan's programs
        and planned courses, with the student's PLAN-SCOPED planning
        customizations composed on top (renamed or annotated requirements,
        requirements hidden from the student's own view, custom requirements
        the student added). Customizations never change what is required or
        what counts as complete, and never change the source: the original of
        every edited requirement is returned alongside it. Owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Requirement groups with customizations applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanRequirementsResponse"
        "404":
          description: Plan not found, or no profile yet
  /plans/{id}/requirement-customizations:
    put:
      operationId: saveRequirementEdit
      tags: [requirements]
      summary: Rename, annotate or hide one source requirement in this plan's planning view
      description: >-
        Upserts the student's planning edit for one SOURCE requirement, named by
        its stable key. A field that is omitted is left as it was; null or an
        empty string clears it. An edit that leaves nothing set removes the row.
        Never modifies the source requirement. Owner only.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementEditInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementCustomizationSummary"
        "400":
          description: Invalid edit
        "404":
          description: Plan not found, or the requirement is not in this plan's sidebar
    delete:
      operationId: resetRequirementEdits
      tags: [requirements]
      summary: Reset one requirement (sourceKey) or every customization (all=true) to the source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: sourceKey
          in: query
          schema:
            type: string
        - name: all
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementCustomizationSummary"
        "400":
          description: Neither sourceKey nor all=true was given
        "404":
          description: Plan not found
  /plans/{id}/requirement-customizations/resolve:
    post:
      operationId: resolveRequirementSourceChange
      tags: [requirements]
      summary: Decide what to do with an edit whose source requirement has changed
      description: >-
        keep_mine re-bases the student's edit onto the updated source;
        use_source discards the edit. Never applies an old edit silently.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementResolveInput"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementCustomizationSummary"
        "400":
          description: Invalid request
        "404":
          description: Plan not found
  /plans/{id}/custom-requirements:
    post:
      operationId: createCustomRequirement
      tags: [requirements]
      summary: Add the student's own planning requirement to a sidebar group
      description: >-
        A custom requirement is the student's own note, marked as such. It is
        never institution-authored and never counts toward a degree.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomRequirementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementCustomizationSummary"
        "400":
          description: Invalid requirement, or too many
        "404":
          description: Plan not found, or the group is not in this plan's sidebar
  /plans/{id}/custom-requirements/{customId}:
    patch:
      operationId: updateCustomRequirement
