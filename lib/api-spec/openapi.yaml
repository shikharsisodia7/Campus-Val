    EvaluationScenario:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
          description: e.g. "unit_cap", "transfer_cap", "prereq", "policy", "trap"
        prompt:
          type: string
          description: User question to ask the AI advisor
        expectedKeywords:
          type: array
          description: Phrases or concepts that MUST appear in a correct answer
          items:
            type: string
        forbiddenKeywords:
          type: array
          description: Phrases that indicate a wrong/hallucinated answer
          items:
            type: string
        risk:
          type: string
          enum: [low, medium, high, critical]
        rubric:
          type: string
          description: Human-readable explanation of what a correct answer looks like
      required:
        - id
        - category
        - prompt
        - expectedKeywords
        - forbiddenKeywords
        - risk
        - rubric
    EvaluationScenarioResult:
      type: object
      properties:
        scenarioId:
          type: string
        category:
          type: string
        risk:
          type: string
        prompt:
          type: string
        response:
          type: string
        matchedKeywords:
          type: array
          items:
            type: string
        missedKeywords:
          type: array
          items:
            type: string
        triggeredForbidden:
          type: array
          items:
            type: string
        score:
          type: number
          description: 0.0 to 1.0
        passed:
          type: boolean
        latencyMs:
          type: integer
      required:
        - scenarioId
        - category
        - risk
        - prompt
        - response
        - matchedKeywords
        - missedKeywords
        - triggeredForbidden
        - score
        - passed
        - latencyMs
    RunEvaluationBody:
      type: object
      properties:
        scenarioIds:
          type: array
          description: Optional subset of scenario IDs. If omitted, all scenarios run.
          items:
            type: string
    EvaluationRunResult:
      type: object
      properties:
        ranAt:
          type: string
          format: date-time
        model:
          type: string
        totalScenarios:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        averageScore:
          type: number
        criticalFailures:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/EvaluationScenarioResult"
      required:
        - ranAt
        - model
        - totalScenarios
        - passed
        - failed
        - averageScore
        - criticalFailures
        - results
