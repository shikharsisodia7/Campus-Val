        title:
          type: [string, "null"]
        note:
          type: [string, "null"]
        hidden:
          type: boolean
          description: The student chose to hide it from their own view of this plan (restorable). In effect only while sourceChanged is false.
        done:
          type: boolean
          description: Custom requirements only. The student's own tick, never official completion.
        sourceChanged:
          type: boolean
          description: The source requirement changed since this was edited, so the edit is not applied until the student reviews it.
        originalLabel:
