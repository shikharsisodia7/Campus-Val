        body:
          type: string
        source:
          type: string
        sourceUrl:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - category
        - summary
        - body
        - source
        - tags

    DashboardSummary:
      type: object
      properties:
        profile:
          $ref: "#/components/schemas/StudentProfile"
          nullable: true
        planningMajor:
          type: string
          nullable: true
          description: >-
            The PRIMARY major the student is currently planning around in their
            main Degree Plan (the plan's primaryMajor, or the profile major when
            unset). This is planning intent, not the official SCU declaration.
        declaredMajor:
          type: string
          nullable: true
          description: >-
            The major from onboarding/profile (aligned with the Workday APR
            record). Differs from planningMajor when the student is planning a
            future major change. Shown so the dashboard can distinguish
            planning intent from the university record.
        classification:
          type: string
          description: First Year, Sophomore, Junior, Senior based on units
        totalUnitsAllSources:
          type: number
        unitsToGraduation:
          type: number
        progressPercent:
          type: number
        canOverloadNextTerm:
          type: boolean
        overloadReason:
          type: string
        unitCapNextTerm:
          type: number
        registrationWindowNote:
          type: string
        nextTerm:
          $ref: "#/components/schemas/Term"
        nextTermYear:
          type: integer
        todayTerm:
          $ref: "#/components/schemas/Term"
          description: Live "right now" SCU term, derived server-side from today's date.
        todayYear:
          type: integer
        upcomingDeadlines:
          type: array
          items:
            $ref: "#/components/schemas/Deadline"
        warnings:
          type: array
          items:
            type: string
        currentRegistrationWindow:
          $ref: "#/components/schemas/RegistrationWindow"
          nullable: true
      required:
        - classification
        - totalUnitsAllSources
        - unitsToGraduation
        - progressPercent
        - canOverloadNextTerm
        - overloadReason
        - unitCapNextTerm
        - registrationWindowNote
        - nextTerm
        - nextTermYear
        - upcomingDeadlines
        - warnings
    RegistrationWindow:
      type: object
      properties:
        targetTerm:
          $ref: "#/components/schemas/Term"
        targetYear:
          type: integer
        status:
          type: string
          enum: [upcoming, open, closed]
        headline:
          type: string
          description: A short human-readable status line, e.g. "Fall 2026 priority registration opens May 27".
        detail:
          type: string
          description: Plain-language detail about the current state and the user's wave.
        myWaveDate:
          type: string
          nullable: true
          description: ISO date when this user's wave opens, if known.
        myWaveLabel:
          type: string
          nullable: true
          description: e.g. "Senior priority — Tier 1".
        nextMilestone:
          type: string
          nullable: true
          description: Free-form description of the next milestone.
        publishedSource:
          type: string
          description: e.g. "SCU Office of the Registrar, Spring 2026 communication".
        lastVerified:
          type: string
          nullable: true
          description: ISO date when these window dates were last manually verified against the Registrar's published calendar.
      required:
        - targetTerm
        - targetYear
        - status
        - headline
        - detail
        - publishedSource
    Deadline:
      type: object
      properties:
        title:
          type: string
        date:
          type: string
        description:
          type: string
      required:
        - title
        - date
        - description

    ProfessorEntry:
      type: object
      properties:
        name:
          type: string
        departments:
          type: array
          items:
            type: string
        courses:
          type: array
          items:
            type: string
          description: Course codes this instructor has been seen teaching in synced sections.
        sectionsCount:
          type: integer
        latestTerm:
          type: string
          description: Most recent synced term they appeared in, e.g. "Fall 2026".
      required:
        - name
        - departments
        - courses
        - sectionsCount
        - latestTerm
    ProfessorList:
      type: object
      properties:
        professors:
          type: array
          items:
            $ref: "#/components/schemas/ProfessorEntry"
        totalSyncedSections:
          type: integer
        emptyReason:
          type: string
          nullable: true
          description: When the list is empty, a short human-readable reason (e.g. "No Workday sections synced yet").
      required:
        - professors
        - totalSyncedSections
    RequirementItem:
      type: object
      properties:
        id:
          type: string
        stableKey:
          type: string
          description: Present on GET /plans/{id}/requirements. The identifier customizations are anchored to.
        customization:
          $ref: "#/components/schemas/RequirementItemCustomization"
        label:
          type: string
        description:
          type: string
        courses:
          type: array
          items:
            type: string
          description: Concrete SCU course codes that satisfy this item (any one). Empty when SCU says "choose from an approved list".
        phase:
          type: string
          nullable: true
          description: Core Curriculum phase (Foundations / Explorations / Integrations) when applicable.
        autoTracked:
          type: boolean
          description: True when completion is computed automatically from the profile's completed courses.
        needsVerification:
          type: boolean
          description: True when SCU defines this as "choose from an approved list" — the student tracks it manually rather than the app inventing a course list.
        coreArea:
          type: object
          nullable: true
          description: >-
            The canonical Core area whose catalog courses satisfy this
            requirement, when CampusVal has a mapping for it. Null for
            requirements with no mapping (e.g. Pathways) — the UI must say so
            rather than offer an empty or invented list.
          required: [tag, courseCount, catalogStatedCount]
          properties:
            tag: { type: string }
            code: { type: string }
            courseCount: { type: integer }
            catalogStatedCount: { type: integer }
        satisfiedBy:
          type: array
          items:
            type: string
          description: Completed course codes that satisfy this item.
        plannedBy:
          type: array
          items:
            type: string
          description: >-
            Planned-but-not-yet-completed course codes that would satisfy this
            item. Present so the UI can show "Planned in Schedule" — a planned
            course is never reported as completed.
        crossSatisfiedBy:
          type: array
          items:
            type: string
          description: >-
            Courses matched to this requirement through the catalog's derived
            Core-area tagging rather than an explicit SCU course list. SCU's
            bulletin scrape did not capture per-course Core designations, so
            these matches always set needsVerification and the student must
            confirm them.
        status:
          type: string
          enum: [completed, planned, open]
          description: >-
            completed = satisfied by a course with completion provenance;
            planned = a planned course would satisfy it; open = neither.
        complete:
          type: boolean
        section:
          type: [string, "null"]
          description: >-
            The Bulletin heading this requirement sits under inside its group
            ("Upper-division themes — one course from each, all with laboratory").
            Null when the group has no sub-headings.
        choice:
          $ref: "#/components/schemas/RequirementChoice"
        departmentNotes:
          type: array
          description: >-
            Department Notes: advising guidance a department stands behind, shown
            beside the requirement. Read-only for students and separate from the
            student's own note (customization.note).
          items:
            $ref: "#/components/schemas/DepartmentNote"
        department:
          type: object
          description: Present when a department changed this requirement's wording or added it.
          required: [overridden, originalLabel, originalDescription, added, programKey, programTitle]
          properties:
            overridden: { type: boolean }
            originalLabel: { type: [string, "null"], description: "The Bulletin's own wording." }
            originalDescription: { type: [string, "null"] }
            added: { type: boolean, description: "A requirement the Bulletin does not list." }
            programKey: { type: string }
            programTitle: { type: string }
      required:
        - id
        - label
        - description
        - courses
        - autoTracked
        - needsVerification
        - satisfiedBy
        - complete
    DegreeCompletionCorrectionInput:
      type: object
      additionalProperties: false
      properties:
        status:
          type: [string, "null"]
          enum: [remaining, complete, null]
          description: remaining = mark as remaining; complete = complete for planning; null = use the APR-based result.
        hidden: { type: boolean }
        note: { type: [string, "null"], maxLength: 4000 }
    DegreeCompletionItem:
      type: object
      required: [key, label, aprStatus, remaining, remainingKind, remainingAmount, registrations, group, groupKind, automatic, correction, effective, confidence, adjusted, trace]
      properties:
        key: { type: string }
        label: { type: string, description: "The requirement as Workday wrote it." }
        aprStatus: { type: [string, "null"], description: "Workday's status, verbatim." }
        remaining: { type: [string, "null"], description: "Workday's Remaining cell, verbatim." }
        remainingKind: { type: [string, "null"] }
        remainingAmount: { type: [number, "null"] }
        registrations:
          type: array
          items:
            type: object
            required: [text, inProgress]
            properties:
              text: { type: string }
              inProgress: { type: boolean }
        group: { type: string }
        groupKind: { type: string }
        automatic:
          type: object
          required: [state, reason, explanation]
          properties:
            state: { type: string, enum: [CLEAR_REMAINING, LIKELY_COMPLETE, AMBIGUOUS] }
            reason: { type: string }
            explanation: { type: string }
        correction:
          type: [object, "null"]
          required: [status, hidden, note, sourceChanged, updatedAt]
          properties:
            status: { type: [string, "null"], enum: [remaining, complete, null] }
            hidden: { type: boolean }
            note: { type: [string, "null"] }
            sourceChanged: { type: boolean, description: "The APR row changed since the correction; it is not applied until confirmed." }
            updatedAt: { type: string }
        effective:
          type: string
          enum: [remaining, appears_complete, needs_review, complete_for_planning]
        confidence:
          type: string
          enum: [CLEAR_REMAINING, LIKELY_COMPLETE, AMBIGUOUS, USER_CORRECTED]
        adjusted: { type: boolean }
