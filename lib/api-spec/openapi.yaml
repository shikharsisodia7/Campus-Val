            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleAvailability"

  /schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List the signed-in student's quarter schedules
      parameters:
        - name: term
          in: query
          required: false
          schema: { type: string, enum: [fall, winter, spring, summer] }
        - name: year
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Schedules (optionally filtered by quarter)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarterScheduleList"
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Create a new schedule for a quarter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuarterScheduleInput"
      responses:
        "201":
          description: Created schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarterScheduleDetail"
        "400":
          description: Invalid input
  /schedules/{id}:
    get:
      operationId: getSchedule
      tags: [schedules]
      summary: Get a schedule with all its events
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Schedule detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarterScheduleDetail"
        "404":
          description: Not found
    patch:
      operationId: updateSchedule
      tags: [schedules]
      summary: Rename a schedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuarterScheduleUpdate"
      responses:
        "200":
          description: Updated schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarterScheduleDetail"
        "404":
          description: Not found
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Delete a schedule and its events
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /schedules/{id}/duplicate:
    post:
      operationId: duplicateSchedule
      tags: [schedules]
      summary: Deep-copy a schedule (independent copy of all events)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: The new independent schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuarterScheduleDetail"
        "404":
          description: Not found
  /schedules/{id}/events:
    post:
      operationId: addScheduleEvent
      tags: [schedules]
      summary: Add a course section or commitment to a schedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleEventInput"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEvent"
        "400":
          description: Invalid input (e.g. unknown section)
        "404":
          description: Schedule not found
        "409":
          description: Section already on this schedule
  /schedules/{id}/events/{eventId}:
    patch:
      operationId: updateScheduleEvent
      tags: [schedules]
      summary: Update an event (swap section or edit a commitment)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleEventUpdate"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleEvent"
        "400":
          description: Invalid input
        "404":
          description: Not found
    delete:
      operationId: deleteScheduleEvent
      tags: [schedules]
      summary: Remove an event from a schedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /schedules/{id}/courses/{courseCode}:
    delete:
      operationId: removeCourseFromSchedule
      tags: [schedules]
      summary: Remove a whole course (every component section) from a schedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: courseCode
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: integer, description: Number of component sections removed. }
        "404":
          description: Schedule not found, or the course is not on it
  /core-areas:
    get:
      operationId: listCoreAreas
      tags: [schedules]
      summary: Authoritative list of SCU Core areas present in the catalog
      responses:
        "200":
          description: Core areas with course counts
          content:
            application/json:
              schema:
                type: object
                required: [coreAreas, pathwaysAvailable]
                properties:
                  coreAreas:
                    type: array
                    items:
                      type: object
                      required: [name, courseCount]
                      properties:
                        name: { type: string }
                        code:
                          type: ["string", "null"]
                          description: Short code students use ("CTW", "C&I", "AW").
                        courseCount:
                          type: integer
                          description: Catalog courses carrying this Core area (0 when the catalog has no tagging for it).
                        catalogStatedCount:
                          type: integer
                          description: Of courseCount, how many are stated outright in the bulletin text (the rest are department/number heuristics).
                        requirementIds:
                          type: array
                          items: { type: string }
                          description: Degree-requirement item ids this area satisfies.
                  pathwaysAvailable:
                    type: boolean
                    description: False until an authoritative Pathway-to-course mapping exists.
  /course-search:
    get:
      operationId: searchCourses
      tags: [schedules]
      summary: Advanced course search by text and academic attributes
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: coreAreas
          in: query
          required: false
          description: Comma-separated Core area names
          schema: { type: string }
        - name: matchMode
          in: query
          required: false
          schema: { type: string, enum: [all, any], default: all }
        - name: term
          in: query
          required: false
          schema: { type: string, enum: [fall, winter, spring, summer] }
        - name: year
          in: query
          required: false
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: offset
          in: query
          required: false
          description: Skip this many results (paging through a large Core-area result set).
          schema: { type: integer, minimum: 0, default: 0 }
        - name: offeredOnly
          in: query
          required: false
          description: >-
            With term+year, true (default) hides courses with no sections that
            quarter; false returns every matching catalog course, offered
            ones first, with the per-course section count.
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Search results with an explicit zero-result state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseSearchResult"

  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
        Requires authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /progress-reports:
    get:
      operationId: listProgressReports
      tags: [progress-report]
      summary: List the authenticated student's Academic Progress Report documents
      description: |
        A student may upload several Workday APR files (one per major / minor). This returns
        the metadata of every one the CALLER owns, in display order. Workbook contents are not
        included. There is no way to address another user's documents.
        If object storage is not configured, returns { available: false, reports: [] }.
      responses:
        "200":
          description: The caller's APR documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReportList"
    post:
      operationId: createProgressReport
      tags: [progress-report]
      summary: Add an uploaded Workday APR file as a new document
      description: |
        Called after the client PUT the file to the presigned upload URL. The file is
        validated and its structure copied before anything is saved; a file that cannot be
        read is rejected (422) and leaves no document behind.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReportCreateInput"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReportDocument"
        "400":
          description: Validation error (bad type, oversize, bad path, bad label)
        "409":
          description: The student already has the maximum number of documents
        "422":
          description: The file could not be read as a Workday APR (see `code`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReportImportFailure"
  /progress-reports/sidebar:
    get:
      operationId: getProgressReportSidebar
      tags: [progress-report]
      summary: The compact APR reference for the planning pages
      description: |
        Every document the caller owns, each with its rows grouped under Workday's own
        headings. The Academic Period, Units and Grade columns are left out ON THE SERVER, so
        a planning page never receives them. No course is matched and no requirement is
        judged: the status text is Workday's.
      responses:
        "200":
          description: Compact reference for all of the caller's documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReportSidebar"
  /progress-reports/assessment:
    get:
      operationId: getDegreeCompletionAssessment
      tags: [progress-report]
      summary: CampusVal's Degree Completion Assessment of the caller's own APRs
      description: |
        A PLANNING AID derived on every request from the caller's own uploaded APRs:
        what appears to remain. Not Workday, not an official degree audit; Workday is
        the definitive reference for degree completion. Only Workday's explicit
        "Not Satisfied" is reported as remaining; "In Progress" is never reported as
        complete. The automatic result is returned beside the student's corrections.
        Owner-only; never reachable through a plan share.
      responses:
        "200":
          description: The assessment, one entry per APR document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeCompletionAssessment"
  /progress-reports/{id}/assessment/items/{itemKey}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: itemKey
        in: path
        required: true
        schema: { type: string, pattern: "^[0-9a-f]{16}$" }
    put:
      operationId: correctDegreeCompletionItem
      tags: [progress-report]
      summary: Save the student's correction of one assessment item (never changes the APR)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DegreeCompletionCorrectionInput"
      responses:
        "200":
          description: Saved (or removed when nothing is left to keep)
          content:
            application/json:
              schema:
                type: object
                required: [saved, itemKey]
                properties:
                  saved: { type: boolean }
                  itemKey: { type: string }
        "400": { description: "Invalid correction" }
        "404": { description: "Not the caller's APR, or the row is no longer in it" }
    delete:
      operationId: resetDegreeCompletionItem
      tags: [progress-report]
      summary: Reset one item to the APR-based assessment
      responses:
        "204": { description: "Reset" }
        "404": { description: "Not the caller's APR" }
  /progress-reports/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getProgressReportDocument
      tags: [progress-report]
      summary: Metadata of one of the caller's APR documents
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReportDocument"
        "404":
          description: No such document for this user
    patch:
      operationId: updateProgressReportDocument
      tags: [progress-report]
      summary: Rename, re-categorise or reorder one document (the file is not touched)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReportUpdateInput"
      responses:
        "200":
          description: The updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReportDocument"
        "400":
          description: Validation error
        "404":
          description: No such document for this user
    delete:
      operationId: deleteProgressReportDocument
      tags: [progress-report]
      summary: Permanently delete one document and its stored file
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "404":
          description: No such document for this user
  /progress-reports/{id}/file:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: downloadProgressReportFile
      tags: [progress-report]
      summary: Stream the original uploaded file of one of the caller's documents
      responses:
        "200":
          description: File content
          content:
            '*/*':
              schema:
                type: string
                format: binary
        "404":
          description: No such document for this user
    put:
      operationId: replaceProgressReportFile
      tags: [progress-report]
      summary: Replace the file of ONE document
      description: |
        The new file is validated and processed first. Only if that succeeds is the document
        switched to it (and its upload date moved to now) and the old file removed. If it
        fails, the document keeps its previous file unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProgressReportFileInput"
      responses:
        "200":
          description: The document, now showing the new file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReportDocument"
        "400":
          description: Validation error
        "404":
          description: No such document for this user
        "422":
          description: The new file could not be read; the previous file was kept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReportImportFailure"
  /progress-reports/{id}/workbook:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getProgressReportWorkbook
      tags: [progress-report]
      summary: The full structural copy of one document's workbook (every sheet, row and column)
      description: |
        For the private APR page only. Includes every column Workday exported, Academic
        Period, Units and Grade among them. Read-only: there is no endpoint that edits it.
      responses:
        "200":
          description: The workbook
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressReportWorkbookEnvelope"
        "404":
          description: No such document for this user

  /degree-checksheets:
    get:
      operationId: listDegreeChecksheets
      tags: [degree-checksheets]
      summary: List the authenticated student's Degree Checksheet documents
      description: |
        Metadata of every department document the CALLER has uploaded, in library order
        (major checksheets, minor checksheets, four-year plans, other resources). The
        preview and the student's tracking are not included. There is no way to address
        another user's documents.
        If object storage is not configured, returns { available: false, documents: [] }.
      responses:
        "200":
          description: The caller's documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetList"
    post:
      operationId: createDegreeChecksheet
      tags: [degree-checksheets]
      summary: Add an uploaded department document
      description: |
        Called after the client PUT the file to the upload link. The file is checked and
        its preview built before anything is saved; a file that is refused (422) leaves no
        document behind.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DegreeChecksheetCreateInput"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetDocument"
        "400":
          description: Validation error (bad type, oversize, bad path, bad title or URL)
        "409":
          description: The student already has the maximum number of documents
        "422":
          description: The file was refused (see `code`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetFailure"
  /degree-checksheets/upload-url:
    post:
      operationId: requestDegreeChecksheetUploadUrl
      tags: [degree-checksheets]
      summary: Request a short-lived, owner-bound upload link for one file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DegreeChecksheetUploadUrlRequest"
      responses:
        "200":
          description: Upload link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetUploadTarget"
        "400":
          description: Unsupported type or oversize
  /degree-checksheets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getDegreeChecksheet
      tags: [degree-checksheets]
      summary: Metadata of one of the caller's documents
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetDocument"
        "404":
          description: No such document for this user
    patch:
      operationId: updateDegreeChecksheet
      tags: [degree-checksheets]
      summary: Rename a document or edit its descriptive metadata (the file is not touched)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DegreeChecksheetUpdateInput"
      responses:
        "200":
          description: The updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetDocument"
        "400":
          description: Validation error
        "404":
          description: No such document for this user
    delete:
      operationId: deleteDegreeChecksheet
      tags: [degree-checksheets]
      summary: Permanently delete one document, its tracking and its stored file
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "404":
          description: No such document for this user
  /degree-checksheets/{id}/render:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getDegreeChecksheetRender
      tags: [degree-checksheets]
      summary: The display copy of one document
      description: |
        A structural copy made for display: a grid for a workbook, blocks for a Word
        document, page sizes for a PDF, dimensions for a picture. Read-only: there is no
        endpoint that edits it, and the student's tracking is stored separately.
      responses:
        "200":
          description: The display copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetRenderEnvelope"
        "404":
          description: No such document for this user
  /degree-checksheets/{id}/file:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: downloadDegreeChecksheetFile
      tags: [degree-checksheets]
      summary: Stream the original uploaded file, byte for byte
      responses:
        "200":
          description: File content
          content:
            '*/*':
              schema:
                type: string
                format: binary
        "404":
          description: No such document for this user
    put:
      operationId: replaceDegreeChecksheetFile
      tags: [degree-checksheets]
      summary: Replace the file of ONE document
      description: |
        The new file is checked and its preview built first. Only if that succeeds is the
        document switched to it and the old file removed. Tracking entries tied to a place
        in the old file stay in place only where the new file offers the same place holding
        the same content; the rest are detached, never drawn over the new file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DegreeChecksheetFileInput"
      responses:
        "200":
          description: The document, now showing the new file, and what happened to its tracking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetReplaceResult"
        "400":
          description: Validation error
        "404":
          description: No such document for this user
        "422":
          description: The new file was refused; the previous file was kept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetFailure"
  /degree-checksheets/{id}/pages/{page}/image:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: page
        in: path
        required: true
        description: 1-based page number
        schema: { type: integer, minimum: 1 }
      - name: scale
        in: query
        required: false
        schema: { type: number, minimum: 1, maximum: 3 }
    get:
      operationId: downloadDegreeChecksheetPageImage
      tags: [degree-checksheets]
      summary: One PDF page, drawn to a PNG
      description: |
        For a client with no PDF renderer of its own (the mobile app). The web app draws PDF
        pages itself, in the browser. Only for a document whose source format is PDF; only
        for a page number the document actually has.
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: No such document, no such page, or the document is not a PDF
        "422":
          description: The page could not be drawn
  /degree-checksheets/{id}/annotations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: listDegreeChecksheetAnnotations
      tags: [degree-checksheets]
      summary: The caller's tracking entries for one document
      responses:
        "200":
          description: Tracking entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetAnnotationList"
        "404":
          description: No such document for this user
    post:
      operationId: createDegreeChecksheetAnnotation
      tags: [degree-checksheets]
      summary: Add a tracking entry (or set the one that belongs to a cell)
      description: |
        A cell holds one entry, so creating an entry for a cell that already has one updates
        it. Points and list entries may be as many as the student likes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DegreeChecksheetAnnotationCreateInput"
      responses:
        "200":
          description: The existing entry for that cell, updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetAnnotation"
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetAnnotation"
        "400":
          description: Validation error, or the document offers no such place
        "404":
          description: No such document for this user
        "409":
          description: The document already has the maximum number of entries
  /degree-checksheets/{id}/annotations/{annotationId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
      - name: annotationId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateDegreeChecksheetAnnotation
      tags: [degree-checksheets]
      summary: Change, clear, move or re-link one tracking entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DegreeChecksheetAnnotationUpdateInput"
      responses:
        "200":
          description: The updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetAnnotation"
        "400":
          description: Validation error
        "404":
          description: No such entry for this user
        "409":
          description: The entry was changed elsewhere since it was loaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegreeChecksheetAnnotationConflict"
    delete:
      operationId: deleteDegreeChecksheetAnnotation
      tags: [degree-checksheets]
      summary: Remove one tracking entry
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedResponse"
        "404":
          description: No such entry for this user

components:
  schemas:
    QuarterSchedule:
      type: object
      required: [id, name, term, year, eventCount, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        term: { type: string }
        year: { type: integer }
        eventCount: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    QuarterScheduleList:
      type: object
      required: [schedules]
      properties:
        schedules:
          type: array
          items: { $ref: "#/components/schemas/QuarterSchedule" }
    QuarterScheduleInput:
      type: object
      required: [name, term, year]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        term: { type: string, enum: [fall, winter, spring, summer] }
        year: { type: integer, minimum: 2000, maximum: 2100 }
    QuarterScheduleUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    QuarterScheduleDetail:
      type: object
      required: [id, name, term, year, events, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        term: { type: string }
        year: { type: integer }
        events:
          type: array
          items: { $ref: "#/components/schemas/ScheduleEvent" }
        courseStatus:
          type: array
          description: Per course on this schedule, which components are chosen and which are still needed.
          items: { $ref: "#/components/schemas/CourseScheduleStatus" }
        createdAt: { type: string }
        updatedAt: { type: string }
    CourseComponentType:
      type: string
      enum: [lecture, lab, discussion, recitation, unknown]
      description: >-
        The normalized component of a section. "unknown" means CampusVal could
        not tell; it is never guessed from a section number.
    CourseComponentRequirement:
      type: object
      required: [componentType, required, sectionCount, sectionsPublished, evidence]
      properties:
        componentType: { $ref: "#/components/schemas/CourseComponentType" }
        required: { type: boolean }
        sectionCount: { type: integer }
        sectionsPublished:
          type: boolean
          description: False when the component is needed but no section for it is listed for the term yet.
        evidence:
          type: array
          items: { type: string }
          description: The published SCU text the requirement comes from.
    CourseComponentPlan:
      type: object
      required: [courseCode, term, year, tentative, offered, multiComponent, components]
      properties:
        courseCode: { type: string }
        term: { type: string }
        year: { type: integer }
        tentative: { type: boolean }
        offered: { type: boolean }
        multiComponent: { type: boolean }
        components:
          type: array
          items: { $ref: "#/components/schemas/CourseComponentRequirement" }
    CourseScheduleStatus:
      type: object
      required: [courseCode, scheduled, missing, notYetPublished, complete]
      properties:
        courseCode: { type: string }
        scheduled:
          type: array
          items: { $ref: "#/components/schemas/CourseComponentType" }
        missing:
          type: array
          description: Needed, sections exist for the term, none chosen yet.
          items: { $ref: "#/components/schemas/CourseComponentType" }
        notYetPublished:
          type: array
          description: Needed, but the term's schedule lists no section for it yet.
          items: { $ref: "#/components/schemas/CourseComponentType" }
        complete:
          type: boolean
          description: Every component that can be scheduled for the term has been.
    ScheduleEventKind:
      type: string
      enum: [section, commitment]
    CommitmentCategory:
      type: string
      enum:
        [
          work,
          athletics,
          student_org,
          special_program,
          external_course,
          personal,
          other,
        ]
    ScheduleEvent:
      type: object
      required: [id, scheduleId, kind, meetingDays, startTime, endTime]
      properties:
        id: { type: integer }
        scheduleId: { type: integer }
        kind: { $ref: "#/components/schemas/ScheduleEventKind" }
        courseCode: { type: ["string", "null"] }
        courseTitle: { type: ["string", "null"] }
        sectionNumber: { type: ["string", "null"] }
        units: { type: ["number", "null"] }
        instructor: { type: ["string", "null"] }
        name: { type: ["string", "null"] }
        category:
          oneOf:
            - $ref: "#/components/schemas/CommitmentCategory"
            - type: "null"
        institution: { type: ["string", "null"] }
        externalCourseLabel: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        meetingDays:
          type: array
          items: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        location: { type: ["string", "null"] }
        componentType:
          description: >-
            Which component of the course this scheduled section is, classified
            against the sections the course offers in the schedule's own term.
            Null for commitments.
          oneOf:
            - type: string
              enum: [lecture, lab, discussion, recitation, unknown]
            - type: "null"
    ScheduleEventInput:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/ScheduleEventKind" }
        courseCode: { type: string }
        sectionNumber: { type: string }
        name: { type: string, maxLength: 120 }
        category: { $ref: "#/components/schemas/CommitmentCategory" }
        institution: { type: string, maxLength: 120 }
        externalCourseLabel: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 500 }
        meetingDays:
          type: array
          items: { type: string, enum: [M, T, W, R, F, S, U] }
        startTime: { type: string }
        endTime: { type: string }
        location: { type: string, maxLength: 120 }
    ScheduleEventUpdate:
      type: object
      properties:
        courseCode: { type: string }
        sectionNumber: { type: string }
        name: { type: string, maxLength: 120 }
        category: { $ref: "#/components/schemas/CommitmentCategory" }
        institution: { type: string, maxLength: 120 }
        externalCourseLabel: { type: string, maxLength: 120 }
        notes: { type: string, maxLength: 500 }
        meetingDays:
          type: array
          items: { type: string, enum: [M, T, W, R, F, S, U] }
        startTime: { type: string }
        endTime: { type: string }
        location: { type: string, maxLength: 120 }
    CourseSearchState:
      type: string
      enum: [results, no_matching_courses, no_sections_this_quarter]
    CourseSearchResult:
      type: object
      required: [state, totalMatching, courses]
      properties:
        state: { $ref: "#/components/schemas/CourseSearchState" }
        totalMatching:
          type: integer
          description: Courses matching the criteria regardless of quarter sections.
        totalWithSections:
          type: ["integer", "null"]
          description: Of totalMatching, how many have a section in the selected quarter. Null when no quarter was given.
        offset: { type: integer }
        hasMore:
          type: boolean
          description: True when more results exist beyond this page.
        courses:
          type: array
          items:
            type: object
            required: [code, title, units, coreAreas, sectionsThisQuarter]
            properties:
              code: { type: string }
              title: { type: string }
              units: { type: number }
              description: { type: string }
              coreAreas:
                type: array
                items: { type: string }
              coreAreaSources:
                type: object
                additionalProperties:
                  type: string
                  enum: [catalog_text, heuristic]
                description: Per Core area, whether the bulletin text states it or CampusVal inferred it from department/number.
              sectionsThisQuarter:
                type: ["integer", "null"]
                description: Null when no quarter filter was applied.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PlanTerm:
      type: string
      enum: [fall, winter, spring, summer, completed]
      description: Term for plan items. "completed" (with academicYear=0) means completed before the plan started.

    PlanPrograms:
      type: object
      required: [additionalMajors, minors, professionalGoals]
      properties:
        primaryMajor:
          type: string
          nullable: true
          description: >-
            Plan-scoped PRIMARY major the student is planning around (a major
            code, e.g. "CHEM"). Planning intent only — it never changes the
            student's official SCU declaration or the Workday APR. When null,
            the profile's onboarding major is used as the primary major.
        additionalMajors:
          type: array
          items: { type: string }
          description: Additional majors (beyond the primary major).
        minors:
          type: array
          items: { type: string }
          description: Declared minors.
        professionalGoals:
          type: array
          items: { $ref: "#/components/schemas/ProfessionalGoal" }
          description: Student-authored professional planning goals. They are never official SCU graduation requirements.

    ProfessionalGoal:
      type: object
      required: [id, name, notes, courseCodes, placeholders]
      properties:
        id:
          type: string
          description: Stable plan-scoped identifier.
        name:
          type: string
        notes:
          type: string
        courseCodes:
          type: array
          items: { type: string }
          description: Student-selected SCU catalog courses; not externally prescribed requirements.
        placeholders:
          type: array
          items: { type: string }
          description: Student-authored manual planning placeholders.

    PlanProgramsUpdate:
      type: object
      required: [additionalMajors, minors, professionalGoals]
      properties:
        primaryMajor:
          type: string
          nullable: true
          description: >-
            Plan-scoped primary major code the student is planning around, or
            null to fall back to the profile's onboarding major. Planning intent
            only — never changes the official SCU declaration or Workday APR.
        additionalMajors:
          type: array
          items: { type: string }
        minors:
          type: array
          items: { type: string }
        professionalGoals:
          type: array
          items:
            oneOf:
              - type: string
                description: Legacy free-text goal retained for backward-compatible writes.
              - $ref: "#/components/schemas/ProfessionalGoal"

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. application/pdf).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          description: >-
            URL the client PUTs the file bytes to. Cloud providers return an
            absolute presigned URL; the local-filesystem provider returns a
            same-origin path (/api/storage/local-upload/...), which always
            resolves against the page the student is on.
        objectPath:
          type: string
          description: Normalized object path (e.g. /objects/uploads/uuid). Store this in your database.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ProgressReportCategory:
      type: string
      enum: [primary_major, second_major, additional_major, minor, additional_minor, other]
      description: |
        What the student says this APR is for. Any number of documents may share a category,
        so nothing limits how many majors or minors a student can have. Never inferred from
        the file.

    ProgressReportImportStatus:
      type: string
      enum: [processing, ready, unsupported, failed]
      description: |
        The state of the FILE IMPORT. "ready" means the file was read and can be displayed —
        it says nothing about academic requirements.

    ProgressReportFileInput:
      type: object
      required: [objectPath, fileName, fileSize, contentType]
      properties:
        objectPath:
          type: string
          description: Object path returned by the upload URL endpoint (must start with /objects/).
        fileName:
          type: string
          maxLength: 255
          description: Original file name (used to check the extension).
        fileSize:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          description: MIME type. Excel (.xlsx) is the supported Workday export; PDF is accepted as a stored original.

    ProgressReportCreateInput:
      allOf:
        - $ref: "#/components/schemas/ProgressReportFileInput"
        - type: object
          required: [label]
          properties:
            label:
              type: string
              minLength: 1
              maxLength: 80
              description: The student's own name for this APR, for example "Finance Major".
            category:
              $ref: "#/components/schemas/ProgressReportCategory"

    ProgressReportUpdateInput:
      type: object
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        category:
          $ref: "#/components/schemas/ProgressReportCategory"
        displayOrder: { type: integer, minimum: 0, maximum: 1000 }

    ProgressReportDocument:
      type: object
      required:
        - id
        - label
        - category
        - displayOrder
        - fileName
        - fileSize
        - contentType
        - sourceFormat
        - uploadedAt
        - importStatus
        - importErrorCode
        - importErrorMessage
        - sheetCount
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        label: { type: string }
        category:
          $ref: "#/components/schemas/ProgressReportCategory"
        displayOrder: { type: integer }
        fileName: { type: string }
        fileSize: { type: integer }
        contentType: { type: string }
        sourceFormat: { type: string, enum: [xlsx, pdf] }
        uploadedAt:
          type: string
          format: date-time
          description: When the CURRENT file was added to CampusVal. A replacement moves it forward. Not a Workday timestamp.
        importStatus:
          $ref: "#/components/schemas/ProgressReportImportStatus"
        importErrorCode: { type: ["string", "null"] }
        importErrorMessage: { type: ["string", "null"] }
        sheetCount: { type: integer, description: Sheets in the stored structural copy (0 when there is none). }
        tableFromPdf:
          type: boolean
          description: True when the table was recovered from a PDF's text positions rather than read from spreadsheet cells. The original PDF remains the faithful copy.
        fileFingerprint:
          type: ["string", "null"]
          description: First 12 hex characters of the file's SHA-256, tying what is displayed to the file it came from.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProgressReportList:
      type: object
      required: [available, reports, maxUploadBytes, maxDocuments]
      properties:
        available:
          type: boolean
          description: False when object storage is not configured for this deployment.
        maxUploadBytes: { type: integer }
        maxDocuments: { type: integer }
        reports:
          type: array
          items: { $ref: "#/components/schemas/ProgressReportDocument" }

    ProgressReportImportFailure:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }

    AprCell:
      type: object
      required: [c, text]
      properties:
        c: { type: integer, description: Source column index (0 = column A). }
        text: { type: string, description: The cell as Excel displayed it. Plain text, never a formula or markup. }
        bold: { type: boolean }
        italic: { type: boolean }
        indent: { type: integer }
        align: { type: string, enum: [left, center, right] }
        filled: { type: boolean }

    AprRow:
      type: object
      required: [r, cells]
      properties:
        r: { type: integer, description: Source row index (0 = row 1). }
        cells:
          type: array
          items: { $ref: "#/components/schemas/AprCell" }

    AprMerge:
      type: object
      required: [r, c, rowSpan, colSpan]
      properties:
        r: { type: integer }
        c: { type: integer }
        rowSpan: { type: integer }
        colSpan: { type: integer }

    AprSheet:
      type: object
      required: [name, index, visibility, rowCount, columnCount, columnWidths, rows, merges]
      properties:
        name: { type: string }
        index: { type: integer }
        visibility: { type: string, enum: [visible, hidden] }
        rowCount: { type: integer }
        columnCount: { type: integer }
        columnWidths:
          type: array
          items: { type: ["number", "null"] }
        rows:
          type: array
          items: { $ref: "#/components/schemas/AprRow" }
        merges:
          type: array
          items: { $ref: "#/components/schemas/AprMerge" }

    AprWorkbook:
      type: object
      required: [version, sourceFormat, sheets, warnings]
      properties:
        version: { type: integer }
        sourceFormat: { type: string, enum: [xlsx, pdf] }
        sheets:
          type: array
          items: { $ref: "#/components/schemas/AprSheet" }
        warnings:
          type: array
          items: { type: string }

    ProgressReportWorkbookEnvelope:
      type: object
      required: [report, workbook]
      properties:
        report:
          $ref: "#/components/schemas/ProgressReportDocument"
        workbook:
          oneOf:
            - $ref: "#/components/schemas/AprWorkbook"
            - type: "null"
          description: Null for a PDF whose table could not be read (it is shown from the original file) and for a document whose import failed.

    AprSidebarColumn:
      type: object
      required: [index, header]
      properties:
        index: { type: integer }
        header: { type: string }

    AprSidebarRow:
      type: object
      required: [r, cells]
      properties:
        r: { type: integer }
        cells:
          type: array
          items: { type: string }
          description: One entry per kept column, in column order.
        bold: { type: boolean }
        indent: { type: integer }

    AprSidebarGroup:
      type: object
      required: [key, kind, label, block, blockIndex, rows]
      properties:
        key: { type: string }
        kind: { type: string, enum: [university, core, major, minor, program, other] }
        label: { type: string }
        block:
          type: ["string", "null"]
          description: The program block this group sits in, as Workday titled it ("Finance Major Requirements"). Null when the export has no block title.
        blockIndex:
          type: integer
          description: Position of that block in the sheet, so blocks stay in source order.
        rows:
          type: array
          items: { $ref: "#/components/schemas/AprSidebarRow" }

    AprSidebarSheet:
      type: object
      required: [name, index, structured, columns, omittedColumns, groups, preambleRowCount, warnings]
      properties:
        name: { type: string }
        index: { type: integer }
        structured:
          type: boolean
          description: False when the table header was not recognised; no rows are sent for that sheet.
        columns:
          type: array
          items: { $ref: "#/components/schemas/AprSidebarColumn" }
        omittedColumns:
          type: array
          items: { type: string }
        groups:
          type: array
          items: { $ref: "#/components/schemas/AprSidebarGroup" }
        preambleRowCount: { type: integer }
        warnings:
          type: array
          items: { type: string }

    ProgressReportSidebarDocument:
      type: object
      required: [report, state, sheets]
      properties:
        report:
          $ref: "#/components/schemas/ProgressReportDocument"
        state:
          type: string
          enum: [ready, unrecognized_layout, original_only, import_failed, processing]
          description: |
            ready: grouped rows are included. unrecognized_layout: the file was read but its
            table was not recognised, so no rows are sent (open the full APR). original_only:
            a PDF whose table could not be read; viewable as the original file. import_failed /
            processing: the file state.
        sheets:
          type: array
          items: { $ref: "#/components/schemas/AprSidebarSheet" }

    ProgressReportSidebar:
      type: object
      required: [available, documents]
      properties:
        available: { type: boolean }
        documents:
          type: array
          items: { $ref: "#/components/schemas/ProgressReportSidebarDocument" }

    DegreeChecksheetCategory:
      type: string
      enum: [major_checksheet, minor_checksheet, four_year_plan, flowchart, advising_resource, other]
      description: What kind of department resource the STUDENT says this is. Never inferred from the file.

    DegreeChecksheetProgramRole:
      type: string
      enum: [major, additional_major, minor, additional_minor, general]
      description: Which of the student's programs the document is for. Descriptive only.

    DegreeChecksheetFormat:
      type: string
      enum: [pdf, xlsx, xls, docx, png, jpg]

    DegreeChecksheetRenderStatus:
      type: string
      enum: [ready, original_only, failed]
      description: |
        The state of the FILE. "ready": a preview exists. "original_only": the file is
        stored and downloadable but has no preview. Says nothing about requirements.

    TrackingStatus:
      type: string
      enum: [not_started, planned, in_progress, completed]
      description: The student's own status for an item. Never an official or verified status.

    TrackingTerm:
      type: string
      enum: [fall, winter, spring, summer]

    DegreeChecksheetUploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, maxLength: 200 }

    DegreeChecksheetUploadTarget:
      type: object
      required: [uploadURL, objectPath, contentType]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
        contentType:
          type: string
          description: The Content-Type the upload must be sent with. The link accepts no other.

    DegreeChecksheetFileInput:
      type: object
      required: [objectPath, fileName, fileSize, contentType]
      properties:
        objectPath:
          type: string
          description: Object path returned by the upload-url endpoint (must start with /objects/).
        fileName: { type: string, minLength: 1, maxLength: 255 }
        fileSize: { type: integer, minimum: 1 }
        contentType: { type: string, maxLength: 200 }

    DegreeChecksheetCreateInput:
      allOf:
        - $ref: "#/components/schemas/DegreeChecksheetFileInput"
        - type: object
          required: [title]
          properties:
            title:
              type: string
              minLength: 1
              maxLength: 120
              description: The student's own name for the document, for example "Finance Major Checksheet".
            category:
              $ref: "#/components/schemas/DegreeChecksheetCategory"
            programName: { type: ["string", "null"], maxLength: 120 }
            programRole:
              oneOf:
                - $ref: "#/components/schemas/DegreeChecksheetProgramRole"
                - type: "null"
            school: { type: ["string", "null"], maxLength: 120 }
            academicYearLabel:
              type: ["string", "null"]
              maxLength: 120
              description: Free text such as "2025-26" or "Fall 2025 and Later". Descriptive only.
            sourceUrl: { type: ["string", "null"], maxLength: 2000 }

    DegreeChecksheetUpdateInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        category:
          $ref: "#/components/schemas/DegreeChecksheetCategory"
        programName: { type: ["string", "null"], maxLength: 120 }
        programRole:
          oneOf:
            - $ref: "#/components/schemas/DegreeChecksheetProgramRole"
            - type: "null"
        school: { type: ["string", "null"], maxLength: 120 }
        academicYearLabel: { type: ["string", "null"], maxLength: 120 }
        sourceUrl: { type: ["string", "null"], maxLength: 2000 }
        sortOrder: { type: integer, minimum: 0, maximum: 1000 }

    DegreeChecksheetDocument:
      type: object
      required:
        - id
        - title
        - category
        - programName
        - programRole
        - school
        - academicYearLabel
        - sourceUrl
        - sortOrder
        - fileName
        - fileSize
        - mimeType
        - sourceFormat
        - sourceVersion
        - uploadedAt
        - renderStatus
        - renderNoteCode
        - renderNoteMessage
        - previewKind
        - inlineTracking
        - fileFingerprint
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        title: { type: string }
        category:
          $ref: "#/components/schemas/DegreeChecksheetCategory"
        programName: { type: ["string", "null"] }
        programRole:
          oneOf:
            - $ref: "#/components/schemas/DegreeChecksheetProgramRole"
            - type: "null"
        school: { type: ["string", "null"] }
        academicYearLabel: { type: ["string", "null"] }
        sourceUrl: { type: ["string", "null"] }
        sortOrder: { type: integer }
        fileName: { type: string }
        fileSize: { type: integer }
        mimeType: { type: string }
        sourceFormat:
          $ref: "#/components/schemas/DegreeChecksheetFormat"
        sourceVersion:
          type: integer
          description: 1 for the first file; +1 each time the file is replaced.
        uploadedAt:
          type: string
          format: date-time
          description: When the CURRENT file was added to CampusVal. A replacement moves it forward. Not a department date.
        renderStatus:
          $ref: "#/components/schemas/DegreeChecksheetRenderStatus"
        renderNoteCode: { type: ["string", "null"] }
        renderNoteMessage: { type: ["string", "null"] }
        previewKind:
          type: ["string", "null"]
          enum: [spreadsheet, pdf, image, document, null]
        inlineTracking:
          type: boolean
          description: True when the document has cells where tracking can be entered in place.
        fileFingerprint:
          type: string
          description: First 12 hex characters of the file's SHA-256. Lets the browser notice an identical file before uploading it again.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DegreeChecksheetList:
      type: object
      required: [available, documents, maxUploadBytes, maxDocuments, acceptedExtensions]
      properties:
        available:
          type: boolean
          description: False when object storage is not configured for this deployment.
        maxUploadBytes: { type: integer }
        maxDocuments: { type: integer }
        acceptedExtensions:
          type: array
          items: { type: string }
        documents:
          type: array
          items: { $ref: "#/components/schemas/DegreeChecksheetDocument" }

    DegreeChecksheetFailure:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }

    ChecksheetTrackingField:
      type: string
      enum: [status, term, both]
      description: |
        What a student column holds. "both" when it is the table's only student column:
        the cell then holds a status and a quarter.

    ChecksheetTrackingColumn:
      type: object
      required: [c, field, header, headerRow]
      properties:
        c: { type: integer }
        field: { $ref: "#/components/schemas/ChecksheetTrackingField" }
        header: { type: string }
        headerRow: { type: integer }

    ChecksheetTrackingCell:
      type: object
      required: [r, c, field]
      properties:
        r: { type: integer }
        c: { type: integer }
        field: { $ref: "#/components/schemas/ChecksheetTrackingField" }

    ChecksheetTrackingLayout:
      type: object
      required: [columns, cells]
      description: Where the source left room for the student to write. About placement only.
      properties:
        columns:
          type: array
          items: { $ref: "#/components/schemas/ChecksheetTrackingColumn" }
        cells:
          type: array
          items: { $ref: "#/components/schemas/ChecksheetTrackingCell" }

    ChecksheetSheet:
      allOf:
        - $ref: "#/components/schemas/AprSheet"
        - type: object
          required: [tracking]
          properties:
            tracking:
              $ref: "#/components/schemas/ChecksheetTrackingLayout"

    ChecksheetPdfPage:
      type: object
      required: [width, height]
      properties:
        width: { type: number }
        height: { type: number }

    ChecksheetDocRun:
      type: object
      required: [text]
      properties:
        text: { type: string, description: Plain text. Never markup. }
        bold: { type: boolean }
        italic: { type: boolean }
        underline: { type: boolean }
        href: { type: string, description: An http(s) link from the document. }

    ChecksheetDocTableCell:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/ChecksheetDocRun" }
        header: { type: boolean }
        colSpan: { type: integer }
        rowSpan: { type: integer }

    ChecksheetDocBlock:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [heading, paragraph, list-item, table, image, image-omitted]
        level: { type: integer, minimum: 1, maximum: 6 }
        ordered: { type: boolean }
        depth: { type: integer }
        runs:
          type: array
          items: { $ref: "#/components/schemas/ChecksheetDocRun" }
        rows:
          type: array
          items:
            type: array
            items: { $ref: "#/components/schemas/ChecksheetDocTableCell" }
        tracking:
          $ref: "#/components/schemas/ChecksheetTrackingLayout"
        mime: { type: string, enum: [image/png, image/jpeg, image/gif] }
        data: { type: string, description: Base64 picture bytes. }
        alt: { type: string }

    DegreeChecksheetRender:
      type: object
      required: [version, kind]
      properties:
        version: { type: integer }
        kind: { type: string, enum: [spreadsheet, pdf, image, document] }
        sheets:
          type: array
          items: { $ref: "#/components/schemas/ChecksheetSheet" }
        pages:
          type: array
          items: { $ref: "#/components/schemas/ChecksheetPdfPage" }
        width: { type: integer }
        height: { type: integer }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/ChecksheetDocBlock" }
        warnings:
          type: array
          items: { type: string }

    DegreeChecksheetRenderEnvelope:
      type: object
      required: [document, render]
      properties:
        document:
          $ref: "#/components/schemas/DegreeChecksheetDocument"
        render:
          oneOf:
            - $ref: "#/components/schemas/DegreeChecksheetRender"
            - type: "null"
          description: Null when the document is kept as an original only.

    DegreeChecksheetAnchor:
      type: object
      description: |
        A position in one document. sheet_cell and sheet_item: sheet,row,col. doc_cell and
        doc_item: block,row,col.
        point: page,x,y with x and y as fractions (0..1) of the page from its top-left
        corner, so a marker keeps its place at any zoom. manual: empty.
      properties:
        sheet: { type: integer, minimum: 0 }
        block: { type: integer, minimum: 0 }
        row: { type: integer, minimum: 0 }
        col: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 0 }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }

    DegreeChecksheetAnchorType:
      type: string
      enum: [sheet_cell, doc_cell, sheet_item, doc_item, point, manual]
      description: |
        sheet_cell / doc_cell: an empty cell the document left for the student (one kind of
        value). sheet_item / doc_item: a filled cell the STUDENT chose to track (status and
        quarter). point: a marker on a page or picture. manual: the student's own list.

    DegreeChecksheetAnnotation:
      type: object
      required:
        - id
        - documentId
        - anchorType
        - anchor
        - field
        - detached
        - itemLabel
        - status
        - term
        - termYear
        - note
        - sortOrder
        - revision
        - createdAt
        - updatedAt
      properties:
        id: { type: integer }
        documentId: { type: integer }
        anchorType:
          $ref: "#/components/schemas/DegreeChecksheetAnchorType"
        anchor:
          $ref: "#/components/schemas/DegreeChecksheetAnchor"
        field:
          type: ["string", "null"]
          enum: [status, term, both, null]
          description: For a cell entry, which value its column holds ("both" for a table's only student column).
        detached:
          type: boolean
          description: |
            True when the file was replaced and this entry's place could not be confirmed in
            the new file. A detached entry is listed, never drawn over the document.
        itemLabel: { type: ["string", "null"] }
        status:
          oneOf:
            - $ref: "#/components/schemas/TrackingStatus"
            - type: "null"
        term:
          oneOf:
            - $ref: "#/components/schemas/TrackingTerm"
            - type: "null"
        termYear:
          type: ["integer", "null"]
          description: The CALENDAR year of the term (winter + 2027 = Winter 2027).
        note: { type: ["string", "null"] }
        sortOrder: { type: integer }
        revision:
          type: integer
          description: +1 on every change. Send it back as expectedRevision to avoid overwriting a newer save.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DegreeChecksheetAnnotationList:
      type: object
      required: [annotations, maxAnnotations]
      properties:
        maxAnnotations: { type: integer }
        annotations:
          type: array
          items: { $ref: "#/components/schemas/DegreeChecksheetAnnotation" }

    DegreeChecksheetAnnotationCreateInput:
      type: object
      required: [anchorType]
      properties:
        anchorType:
          $ref: "#/components/schemas/DegreeChecksheetAnchorType"
        anchor:
          $ref: "#/components/schemas/DegreeChecksheetAnchor"
        itemLabel: { type: ["string", "null"], maxLength: 200 }
        status:
          oneOf:
            - $ref: "#/components/schemas/TrackingStatus"
            - type: "null"
        term:
          oneOf:
            - $ref: "#/components/schemas/TrackingTerm"
            - type: "null"
        termYear: { type: ["integer", "null"], minimum: 2000, maximum: 2100 }
        note: { type: ["string", "null"], maxLength: 500 }

    DegreeChecksheetAnnotationUpdateInput:
      type: object
      properties:
        itemLabel: { type: ["string", "null"], maxLength: 200 }
        status:
          oneOf:
            - $ref: "#/components/schemas/TrackingStatus"
            - type: "null"
        term:
          oneOf:
            - $ref: "#/components/schemas/TrackingTerm"
            - type: "null"
        termYear: { type: ["integer", "null"], minimum: 2000, maximum: 2100 }
        note: { type: ["string", "null"], maxLength: 500 }
        anchor:
          $ref: "#/components/schemas/DegreeChecksheetAnchor"
        keepAsListEntry:
          type: boolean
          description: Turn a detached entry into an entry of the student's own list.
        expectedRevision:
          type: integer
          minimum: 1
          description: The revision the change was based on. A mismatch is refused with 409.

    DegreeChecksheetAnnotationConflict:
      type: object
      required: [error, current]
      properties:
        error: { type: string }
        current:
          $ref: "#/components/schemas/DegreeChecksheetAnnotation"

    DegreeChecksheetReplaceResult:
      type: object
      required: [document, tracking]
      properties:
        document:
          $ref: "#/components/schemas/DegreeChecksheetDocument"
        tracking:
          type: object
          required: [kept, detached]
          properties:
            kept: { type: integer, description: Entries still in place. }
            moved:
              type: integer
              description: Of the kept entries, markers that followed their page to a new page number.
            detached: { type: integer, description: Entries whose place could not be confirmed in the new file. }

    DeletedResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: boolean

    StudentType:
      type: string
      enum: [first_year, transfer, continuing, graduate, postgrad]
    PlanType:
      type: string
      enum: [degree, tentative]
    PlanItemType:
      type: string
      enum: [course, requirement_placeholder]
    AcademicPlan:
      type: object
      required: [id, name, planType, itemCount, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        planType: { $ref: "#/components/schemas/PlanType" }
        sourcePlanId: { type: ["integer", "null"] }
        metadata: { $ref: "#/components/schemas/PlanMetadata" }
        itemCount: { type: integer }
        programs:
          oneOf:
            - $ref: "#/components/schemas/PlanPrograms"
            - type: "null"
        createdAt: { type: string }
        updatedAt: { type: string }
    AcademicPlanList:
      type: object
      required: [plans]
      properties:
        plans:
          type: array
          items: { $ref: "#/components/schemas/AcademicPlan" }
    AcademicPlanInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        copyFromPlanId:
          type: ["integer", "null"]
          description: Copy all items from this plan; omit or null to start blank.
    AcademicPlanUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        metadata: { $ref: "#/components/schemas/PlanMetadata" }
        programs:
          oneOf:
            - $ref: "#/components/schemas/PlanPrograms"
            - type: "null"
    AcademicPlanDuplicateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    BulkImportPlanItemsBody:
      type: object
      required: [courseCodes]
      properties:
        courseCodes:
          type: array
          items: { type: string }
          minItems: 1
          maxItems: 50
          description: Course codes from the progress report to add to the Completed area.
    BulkImportPlanItemsResult:
      type: object
      required: [added, skipped]
      properties:
        added:
          type: array
          items: { $ref: "#/components/schemas/PlanItem" }
        skipped:
          type: array
          items: { type: string }
          description: Course codes already present anywhere in the plan (not re-added).
    PlanItem:
      type: object
      required: [id, planId, itemType, academicYear, term, position]
      properties:
        id: { type: integer }
        planId: { type: integer }
        itemType: { $ref: "#/components/schemas/PlanItemType" }
        courseCode: { type: ["string", "null"] }
        courseTitle: { type: ["string", "null"] }
        units: { type: ["number", "null"] }
        requirementId: { type: ["string", "null"] }
        requirementCategory: { type: ["string", "null"] }
        requirementLabel: { type: ["string", "null"] }
        academicYear:
          type: integer
          description: Start year of the academic year (2026 = 2026-2027). Use 0 with term="completed".
        term: { $ref: "#/components/schemas/PlanTerm" }
        bucket: { $ref: "#/components/schemas/PlanItemBucket" }
        completionSource:
          oneOf:
            - $ref: "#/components/schemas/CompletionSource"
            - type: "null"
        position: { type: integer }
        note: { type: ["string", "null"] }
        provenance:
          type: ["string", "null"]
          enum: ["student_asserted", "report_imported", "sample_plan", null]
          description: How this item was added. Defaults to student_asserted.
    AcademicPlanDetail:
      type: object
      required: [id, name, planType, items, createdAt, updatedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        planType: { $ref: "#/components/schemas/PlanType" }
        sourcePlanId: { type: ["integer", "null"] }
        metadata: { $ref: "#/components/schemas/PlanMetadata" }
        programs:
          oneOf:
            - $ref: "#/components/schemas/PlanPrograms"
            - type: "null"
        items:
          type: array
          items: { $ref: "#/components/schemas/PlanItem" }
        createdAt: { type: string }
        updatedAt: { type: string }
    PlanItemInput:
      type: object
      required: [itemType, academicYear, term]
      properties:
        itemType: { $ref: "#/components/schemas/PlanItemType" }
        courseCode:
          type: string
          description: Required for course items; must exist in the SCU catalog.
        requirementId: { type: string }
        requirementCategory: { type: string }
        requirementLabel:
          type: string
          description: Required for requirement_placeholder items.
        academicYear:
          type: integer
          description: Use 0 with term="completed" for pre-plan coursework.
        term: { $ref: "#/components/schemas/PlanTerm" }
        note: { type: string }
        allowDuplicate:
          type: boolean
          description: Set true to add a course already present in this plan.
        bucket:
          $ref: "#/components/schemas/PlanItemBucket"
        completionSource:
          $ref: "#/components/schemas/CompletionSource"
        provenance:
          type: string
          enum: [student_asserted, report_imported, sample_plan]
          description: Defaults to student_asserted when adding to the completed area.
    PlanItemUpdate:
      type: object
      properties:
        academicYear: { type: integer }
        term: { $ref: "#/components/schemas/PlanTerm" }
        bucket: { $ref: "#/components/schemas/PlanItemBucket" }
        completionSource:
          oneOf:
            - $ref: "#/components/schemas/CompletionSource"
            - type: "null"
        position: { type: integer }
        note: { type: ["string", "null"] }
        provenance:
          type: string
          enum: [student_asserted, report_imported, sample_plan]
    PlanMetadata:
      type: object
      properties:
        addedYears:
          type: array
          items: { type: integer, minimum: 2000, maximum: 2100 }
        summerYears:
          type: array
          items: { type: integer, minimum: 2000, maximum: 2100 }
        scenarioMajors:
          type: array
          items: { type: string, minLength: 1, maxLength: 120 }
          description: Draft-only additional majors; does not alter the official student profile.
        scenarioMinors:
          type: array
          items: { type: string, minLength: 1, maxLength: 120 }
          description: Draft-only additional minors; does not alter the official student profile.
        sampleSource:
          type: object
          description: >-
            Set when the plan was made from, or had items added from, a sample plan.
            Provenance only: the plan is an independent copy and later changes to the
            sample plan never reach it.
          required: [samplePlanId, slug, version, title, loadedAt]
          properties:
            samplePlanId: { type: integer }
            slug: { type: string }
            version: { type: string }
            title: { type: string }
            sourceLabel: { type: [string, "null"] }
            sourceUrl: { type: [string, "null"] }
            loadedAt: { type: string }
    PlanItemBucket:
      type: string
      enum: [planned, completed]
      description: >-
        Where the item lives: "planned" places it in a real term column;
        "completed" places it in the Completed Before Current Plan area.
    CompletionSource:
      type: string
      enum:
        - prior_to_scu
        - transfer_credit
        - ap_ib_test_credit
        - previously_completed_scu
        - other_institution
        - manually_marked
      description: >-
        Student-asserted provenance for a completed item. Distinct from
        verified Academic Progress Report data.
    PlaceholderReplacement:
      type: object
      required: [courseCode]
      properties:
        courseCode: { type: string, minLength: 1 }
    PlanDuplicateWarning:
      type: object
      required: [error, duplicate]
      properties:
        error: { type: string }
        duplicate: { type: boolean }
    ScheduleAvailabilityTerm:
      type: object
      required: [term, year, status, sourceUrl, sourceLabel, publishedDate, lastVerified, importedDate, freshness, officialSectionCount, syncedSectionCount]
      properties:
        term: { $ref: "#/components/schemas/Term" }
        year: { type: integer }
        status:
          type: string
          enum: [published, tentative]
          description: published = official schedule with sections/instructors; tentative = registrar tentative schedule (no instructors/sections confirmed)
        sourceUrl:
          type: string
          description: Official SCU source for the term schedule.
        sourceLabel: { type: string }
        publishedDate:
          type: [string, "null"]
          description: Official publication date when known.
        lastVerified:
          type: string
          description: Date the term data was last checked against the official source.
        importedDate:
          type: string
          description: Date CampusVal imported this schedule snapshot.
        freshness:
          type: string
          enum: [fresh, verify_soon, stale]
        officialSectionCount: { type: integer }
        syncedSectionCount: { type: integer }
        offeredCourseCodes:
          type: array
          items: { type: string }
          description: Normalized (uppercase, single-spaced) course codes present in the official schedule for this term. Used to flag planned courses absent from the published/tentative schedule.
    ScheduleAvailability:
