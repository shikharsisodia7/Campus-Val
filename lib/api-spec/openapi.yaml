      type: object
      description: >-
        The student's PLANNING customization of a requirement. Not an SCU
        requirement and never a claim about the degree.
      required: [kind, titleEdited, title, note, hidden, done, sourceChanged, originalLabel, originalDescription, updatedAt]
      properties:
        kind:
          type: string
          enum: [edit, custom]
        titleEdited:
          type: boolean
