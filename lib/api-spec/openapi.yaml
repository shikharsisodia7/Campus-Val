            properties:
              key: { type: string }
              label: { type: string }
              note: { type: [string, "null"] }
              courses:
                type: array
                items: { type: string }
        alternatives:
          type: array
          description: The course sets of an alternatives rule; completing any one satisfies it.
          items:
            type: object
