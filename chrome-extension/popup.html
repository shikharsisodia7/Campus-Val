<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CampusVal</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1a1a1a;
        background: #fafafa;
      }
      .hero {
        background: linear-gradient(135deg, #8C1515 0%, #6b1010 100%);
        padding: 18px 18px 22px;
        color: #fff;
        position: relative;
        overflow: hidden;
      }
      .hero::after {
        content: "";
        position: absolute; inset: 0;
        background: radial-gradient(circle at 80% 0%, rgba(176,136,80,0.35), transparent 60%);
        pointer-events: none;
      }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
      .badge {
        width: 28px; height: 28px; border-radius: 6px;
        background: #fff; color: #8C1515;
        display: flex; align-items: center; justify-content: center;
        font-family: Georgia, serif; font-weight: 700;
      }
      h1 { margin: 12px 0 4px; font-size: 19px; font-family: Georgia, serif; }
      p.sub { margin: 0; font-size: 12px; opacity: 0.85; }
      .actions { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
      button, a.btn {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 12px; border-radius: 8px; cursor: pointer;
        border: 1px solid #e5e5e5; background: #fff; color: #1a1a1a;
        font-size: 13px; font-weight: 500; text-decoration: none;
        transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
      }
      button:hover, a.btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px -6px rgba(140,21,21,0.25);
        border-color: #d4d4d4;
      }
      button.primary, a.btn.primary {
        background: #8C1515; color: #fff; border-color: #8C1515;
      }
      .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 14px 14px; }
      .quick a {
        font-size: 12px; padding: 8px 10px; border-radius: 6px;
        background: #fff; border: 1px solid #eee; color: #444; text-decoration: none;
      }
      .quick a:hover { border-color: #8C1515; color: #8C1515; }
      .footer {
        padding: 8px 14px 12px; font-size: 11px; color: #888;
        border-top: 1px solid #eee; background: #fff;
      }
      input.url {
        width: 100%; font-size: 12px; padding: 6px 8px;
        border: 1px solid #e5e5e5; border-radius: 6px; margin-top: 4px;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="brand"><span class="badge">CV</span><span>CampusVal</span></div>
      <h1>SCU AI Advising</h1>
      <p class="sub">Plan quarters, check prereqs, ask the advisor — even by voice.</p>
    </div>
    <div class="actions">
      <button id="open-tab" class="primary">
        Open CampusVal in a new tab
      </button>
      <button id="open-sidepanel">
        Open in side panel
      </button>
    </div>
    <div class="quick">
      <a href="#" data-path="/advisor">AI Advisor</a>
      <a href="#" data-path="/voice">Voice Advisor</a>
      <a href="#" data-path="/planner">Planner</a>
      <a href="#" data-path="/courses">Courses</a>
      <a href="#" data-path="/gpa">GPA</a>
      <a href="#" data-path="/graduation-paths">Grad Paths</a>
    </div>
    <div class="footer">
      Server:
      <input id="url-input" class="url" type="text" placeholder="https://your-campusval.replit.app" />
    </div>
    <script src="popup.js"></script>
  </body>
</html>
